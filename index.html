<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>懒人备忘录 · 躺平也能记事</title>

<!--
================================================================================
  懒人备忘录 v5.0（工程化重构版）
  ──────────────────────────────────────────────────────────────────────────────
  技术栈：原生 HTML + CSS + JavaScript（零框架、零外部依赖）
  后端：  Bmob 后端云 REST API（数据库 + 文件存储 + 用户系统）
  定位：  面向普通学生、上班族的日常待办 / 琐事记录工具

  项目结构：
    index.html          ← HTML 结构（仅页面骨架 + onclick 事件绑定）
    css/style.css       ← 全部样式（6 套主题 + 响应式 + 动画）
    js/app.js           ← 全部逻辑（API 引擎 / 数据操作 / AI / 交互 / 初始化）
    server/sse_server.py← Python SSE 流式服务（AI 推送 + 归属校验 + 托管静态文件）

  ★★★ 手动配置区 ★★★
  请把 js/app.js 顶部 APPLICATION_ID 和 REST_API_KEY 换成你自己的 Bmob 密钥：
  1. 登录 Bmob 后台 → 设置 → 应用密钥
  2. 复制 Application ID  → 填到 APPLICATION_ID
  3. 复制 REST API Key     → 填到 REST_API_KEY

  ★★★ Bmob 后台数据表配置 ★★★
  表名：Memo
  字段：
    title     String    备忘标题
    content   String    备忘内容 / 备注
    isFinish  Boolean   是否已完成
    imgUrl    String    图片 URL（Bmob 文件存储返回的链接，或内嵌 dataURL）
    username  String    创建者用户名（用于用户数据隔离）
    tag       String    标签（工作 / 生活 / 学习 / 灵感，选填）
  注意：imgUrl、username、tag 字段需在 Bmob 后台手动新增，客户端不可见不要勾选。

  ★★★ 功能列表 ★★★
  - 用户注册 / 登录 / 退出（localStorage 会话保持）
  - ACL 用户数据隔离（where={username} 云端过滤）
  - 备忘增删改查（写操作内置归属校验）
  - 6 套主题配色一键切换
  - AI 语义分析备忘生成器（意图识别 + 行动清单）
  - 已有笔记一键 AI 总结润色（SSE 流式打字机输出，归属校验后自动新建笔记，可中断）
  - 标签选择 + 标签筛选
  - 本地即时搜索（DOM 显隐，零网络请求）
  - 图片上传即落库（Bmob 文件服务 / dataURL 压缩降级）
  - 图片灯箱全屏放大（ESC 关闭）
  - 勾选完成撒花动画 + 全部完成庆祝弹窗
  - 一键导出全部备忘到剪贴板
  - 诱饵输入框 + 多次延迟清空（防御浏览器自动填充）

  ★★★ 部署说明 ★★★
  - 本地调试：双击 start-server.bat，通过 http://localhost:8001 访问
  - 公网部署：上传到 Vercel / Netlify / GitHub Pages 即可获得 HTTPS 链接
================================================================================
-->

<link rel="stylesheet" href="css/style.css?v=20260912" />
</head>

<body>

<!-- ============================================================================
     HTML 结构区
     ======================================================================= -->
<div class="container">

  <!-- 顶栏：用户信息 + 主题切换 -->
  <div class="top-bar">
    <div class="user-info" id="userBar" style="display:none;">
      👋 <b id="userName"></b>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
    <div class="theme-switch">
      <div class="theme-dot active" data-t="cream"    onclick="setTheme('cream')"    title="奶油黄"></div>
      <div class="theme-dot"        data-t="pink"     onclick="setTheme('pink')"     title="蜜桃粉"></div>
      <div class="theme-dot"        data-t="mint"     onclick="setTheme('mint')"     title="薄荷绿"></div>
      <div class="theme-dot"        data-t="sky"      onclick="setTheme('sky')"      title="天空蓝"></div>
      <div class="theme-dot"        data-t="lavender" onclick="setTheme('lavender')" title="薰衣紫"></div>
      <div class="theme-dot"        data-t="coral"    onclick="setTheme('coral')"    title="珊瑚橙"></div>
    </div>
  </div>

  <!-- 标题区 -->
  <div class="header">
    <h1>📝 懒人备忘录</h1>
    <div class="subtitle">躺平也要记事，琐事不遗漏 ✿</div>
  </div>

  <!-- 统计看板 -->
  <div class="stats-board" id="statsBoard" style="display:none;">
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">📋 总数</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-label">✅ 已完成</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" id="statTodo">0</div>
      <div class="stat-label">⏳ 待完成</div>
    </div>
  </div>

  <!-- 输入表单 -->
  <div class="form-card">
    <!-- 诱饵输入框：吸收浏览器自动填充的用户名密码，防止污染其他字段 -->
    <div style="position:absolute;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden;">
      <input type="text" id="decoyUser" tabindex="-1" />
      <input type="password" id="decoyPass" tabindex="-1" />
    </div>

    <!-- 编辑提示 -->
    <div class="edit-bar" id="editBar">
      <span>📝 正在编辑...</span>
      <button class="btn-cancel" onclick="exitEditMode()">取消</button>
    </div>

    <!-- AI 生成备忘 -->
    <div class="ai-row">
      <input type="text" id="aiInput" placeholder="输入想法，AI 帮你生成备忘…" autocomplete="new-password" />
      <button class="btn-ai" onclick="generateAIMemo()">✨<span>生成</span></button>
    </div>

    <!-- 标题 / 内容输入 -->
    <input type="text" id="titleInput" maxlength="50" placeholder="备忘标题（如：拿快递）" autocomplete="new-password" />
    <textarea id="contentInput" maxlength="500" placeholder="备注内容（选填，可换行）" autocomplete="new-password"></textarea>

    <!-- 标签 + 图片上传 合并一行 -->
    <div class="form-bottom-row">
      <div class="tag-row" id="tagPicker">
        <button class="tag-pick" data-tag="工作" onclick="pickTag('工作')">工作</button>
        <button class="tag-pick" data-tag="生活" onclick="pickTag('生活')">生活</button>
        <button class="tag-pick" data-tag="学习" onclick="pickTag('学习')">学习</button>
        <button class="tag-pick" data-tag="灵感" onclick="pickTag('灵感')">灵感</button>
      </div>
      <div class="img-upload-mini">
        <button type="button" class="btn-upload" onclick="$('fileInput').click()">📷<span>传图</span></button>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
    </div>

    <!-- 图片大图预览（选图后 / 编辑备忘时显示，点击图片可全屏放大，✕ 可移除） -->
    <div class="img-preview-wrap" id="imgPreviewWrap">
      <img id="imgPreview" alt="备忘图片预览" onclick="openLightbox(this.src)" />
      <button type="button" class="img-remove" title="移除这张图片" onclick="removeCurrentImg()">✕</button>
    </div>

    <!-- 提交按钮 -->
    <button class="btn btn-primary" id="submitBtn" onclick="submitMemo()">＋ 添加备忘</button>
  </div>

  <!-- 工具栏：搜索 + 标签筛选 + 导出 -->
  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="搜索标题或内容，即时过滤..." autocomplete="off" oninput="applySearch()" />
      <button id="searchClear" class="search-clear" onclick="clearSearch()" style="display:none;" title="清空搜索">✕</button>
    </div>
    <div class="tag-filter">
      <button class="tag-filter-btn active" data-filter="all" onclick="filterTag('all')">全部</button>
      <button class="tag-filter-btn"      data-filter="工作" onclick="filterTag('工作')">工作</button>
      <button class="tag-filter-btn"      data-filter="生活" onclick="filterTag('生活')">生活</button>
      <button class="tag-filter-btn"      data-filter="学习" onclick="filterTag('学习')">学习</button>
      <button class="tag-filter-btn"      data-filter="灵感" onclick="filterTag('灵感')">灵感</button>
    </div>
    <button class="btn-export" onclick="exportMemos()">📋 导出全部</button>
  </div>

  <!-- 备忘列表 -->
  <div class="memo-list" id="memoList"></div>

</div>

<!-- 加载遮罩 -->
<div class="loading-mask" id="loadingMask"><div class="spinner"></div></div>
<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<!-- 庆祝弹窗 -->
<div class="celebrate" id="celebrate">
  <div class="celebrate-box">
    <span class="icon">🎉</span>
    <h2>全部搞定啦！</h2>
    <p id="celebrateMsg">太厉害了，所有备忘都完成了～</p>
    <button class="btn btn-primary" onclick="closeCelebrate()">好耶！</button>
  </div>
</div>

<!-- 图片灯箱：点击任意图片全屏放大，再点任意处或按 ESC 关闭 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" alt="图片大图" />
</div>

<!-- AI SSE 流式润色面板：思考中状态 + 逐字打字机输出 + 中断/完成操作（配套 server/sse_server.py） -->
<div class="stream-overlay" id="streamOverlay">
  <div class="stream-box">
    <div class="stream-head">
      <span class="stream-title">✨ AI 总结润色</span>
      <button class="stream-close" onclick="AI_STREAM.close()" title="关闭（生成中关闭将中断且不保存）">✕</button>
    </div>
    <div class="stream-sub">
      <span id="streamSource"></span>
      <span class="stream-cat" id="streamCategory" style="display:none"></span>
    </div>
    <div class="stream-body thinking" id="streamBody">
      <span class="think-dots"><i></i><i></i><i></i></span>AI 思考中…
    </div>
    <div class="stream-foot">
      <span class="stream-status st-thinking" id="streamStatus">AI 正在阅读笔记、整理思路…</span>
      <span class="stream-actions" id="streamActions"></span>
    </div>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>📝 懒人备忘录</h2>
    <div class="login-sub">登录后即可管理你的待办</div>
    <div class="login-tabs">
      <button class="login-tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="login-tab"        id="tabReg"   onclick="switchTab('register')">注册</button>
    </div>
    <input type="text" id="loginUser" maxlength="20" placeholder="用户名（3-20位）" autocomplete="username" />
    <input type="password" id="loginPass" maxlength="32" placeholder="密码（6-32位）" autocomplete="current-password" />
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
  </div>
</div>

<script src="js/app.js?v=20260914"></script>
</body>
</html>
