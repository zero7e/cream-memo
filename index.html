<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>懒人备忘录 · 躺平也能记事</title>

<!--
================================================================================
  懒人备忘录 v4.0（单文件版）
  技术栈：原生 HTML + CSS + JavaScript（零框架、零外部依赖）
  后端：Bmob 后端云 REST API（数据库 + 文件存储）
  定位：面向普通学生、上班族的日常待办/琐事记录工具

  ★★★ 手动配置区 ★★★
  请把下面 APPLICATION_ID 和 REST_API_KEY 换成你自己的 Bmob 密钥：
  1. 登录 Bmob 后台 → 设置 → 应用密钥
  2. 复制 Application ID → 填到 APPLICATION_ID
  3. 复制 REST API Key    → 填到 REST_API_KEY

  ★★★ Bmob 后台数据表配置 ★★★
  表名：Memo
  字段：
    title     String    备忘标题
    content   String    备忘内容/备注
    isFinish  Boolean   是否已完成
    imgUrl    String    图片URL（Bmob文件存储返回的链接）
    username  String    创建者用户名（用于用户数据隔离）
    tag       String    标签（工作/生活/学习/灵感，选填）
  注意：imgUrl、username、tag 字段需在 Bmob 后台手动新增，客户端不可见不要勾选。

  ★★★ Bmob 能力使用说明 ★★★
  - 数据库：Memo 表存储备忘录数据（增删改查）
  - 文件存储：上传图片到 Bmob 文件服务，返回 URL 存入 imgUrl 字段
  - 用户系统：注册/登录/会话令牌，实现用户数据隔离

  ★★★ 部署说明 ★★★
  - 本地调试：双击 start-server.bat，通过 http://localhost:8001 访问
  - 公网部署：上传到 Vercel / Netlify / GitHub Pages 即可获得 HTTPS 链接
================================================================================
-->

<style>
/* ==========================================================================
   一、CSS 样式区
   ========================================================================== */

/* ---- 1. 主题配色变量（3套皮肤，用 data-theme 切换） ---- */
:root,
[data-theme="cream"] {
  --bg:        #FFF3D9;
  --card:      #FFFDF6;
  --primary:   #f0b429;
  --primary-l: #ffd97a;
  --accent:    #FFD6E0;
  --text:      #6b5b3e;
  --text-l:    #b0967a;
  --border:    rgba(180,150,90,0.18);
  --shadow:    rgba(180,150,90,0.18);
  --done-bg:   #E8E0D0;
  --btn-del:   #FFE0E0;
  --btn-del-t: #c0506a;
}
[data-theme="pink"] {
  --bg:        #FFE4F0;
  --card:      #FFF5FA;
  --primary:   #ff7eb5;
  --primary-l: #ffb3d1;
  --accent:    #E0C9FF;
  --text:      #6b3e5b;
  --text-l:    #b07a96;
  --border:    rgba(180,90,130,0.15);
  --shadow:    rgba(180,90,130,0.18);
  --done-bg:   #F0DDE8;
  --btn-del:   #FFD0E0;
  --btn-del-t: #c0506a;
}
[data-theme="mint"] {
  --bg:        #D9F5E9;
  --card:      #F0FFF8;
  --primary:   #34c08a;
  --primary-l: #7eddb8;
  --accent:    #C2E8FF;
  --text:      #3e6b5b;
  --text-l:    #7ab09a;
  --border:    rgba(60,120,90,0.15);
  --shadow:    rgba(60,120,90,0.15);
  --done-bg:   #D5EDE0;
  --btn-del:   #FFE0E0;
  --btn-del-t: #c0506a;
}

/* ---- 2. 基础重置 ---- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px 12px 40px;
  transition: background 0.4s ease, color 0.4s ease;
}
.container {
  max-width: 620px; margin: 0 auto;
  background: var(--card);
  border-radius: 28px; padding: 24px 20px 28px;
  box-shadow: 0 6px 24px var(--shadow);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}

/* ---- 3. 顶栏（用户信息 + 主题切换） ---- */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px; font-size: 13px;
}
.user-info { color: var(--text-l); }
.user-info b { color: var(--text); }
.btn-logout {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 12px; border-radius: 8px; padding: 4px 10px;
  background: var(--btn-del); color: var(--btn-del-t); margin-left: 6px;
}
.theme-switch { display: flex; gap: 6px; }
.theme-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; transition: transform 0.2s;
}
.theme-dot:hover { transform: scale(1.2); }
.theme-dot[data-t="cream"] { background: #FFF3D9; border-color: #f0b429; }
.theme-dot[data-t="pink"]  { background: #FFE4F0; border-color: #ff7eb5; }
.theme-dot[data-t="mint"]  { background: #D9F5E9; border-color: #34c08a; }
.theme-dot.active { border-width: 3px; }

/* ---- 4. 标题区 ---- */
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 24px; color: var(--text); }
.header .subtitle { font-size: 13px; color: var(--text-l); margin-top: 4px; }

/* ---- 5. 统计看板 ---- */
.stats-board {
  display: flex; justify-content: space-around;
  background: var(--bg); border-radius: 16px; padding: 14px 10px;
  margin-bottom: 16px; box-shadow: inset 0 0 0 1.5px var(--border);
}
.stat-item { text-align: center; flex: 1; }
.stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-l); margin-top: 2px; }
.stat-divider { width: 1px; background: var(--border); margin: 4px 0; }

/* ---- 6. 输入表单 ---- */
.form-card {
  background: var(--bg); border-radius: 20px; padding: 16px 14px;
  margin-bottom: 16px; box-shadow: inset 0 0 0 1.5px var(--border);
}
.form-card input[type="text"],
.form-card textarea {
  width: 100%; border: none; outline: none;
  background: var(--card); border-radius: 14px;
  padding: 11px 14px; font-size: 15px; color: var(--text);
  font-family: inherit; box-shadow: inset 0 0 0 1.5px var(--border);
  transition: box-shadow 0.2s ease; margin-bottom: 10px;
}
.form-card input:focus,
.form-card textarea:focus { box-shadow: inset 0 0 0 2px var(--primary); }
.form-card textarea { resize: none; min-height: 56px; }

/* 图片上传 */
.img-upload-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.img-preview {
  width: 54px; height: 54px; border-radius: 14px; object-fit: cover;
  border: 1.5px solid var(--border); display: none;
}
.btn-upload {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 13px; border-radius: 12px; padding: 8px 14px;
  background: var(--accent); color: var(--text); transition: opacity 0.2s;
}
.btn-upload:hover { opacity: 0.85; }
#fileInput { display: none; }

/* 标签选择 */
.tag-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tag-pick {
  border: 1.5px solid var(--border); background: var(--card);
  border-radius: 10px; padding: 5px 12px; font-size: 13px;
  cursor: pointer; font-family: inherit; color: var(--text-l); transition: all 0.2s;
}
.tag-pick.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tag-pick:hover { opacity: 0.85; }

/* 按钮 */
.btn {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 600; border-radius: 14px;
  padding: 12px 20px; transition: all 0.2s ease;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary-l), var(--primary));
  color: #fff; width: 100%; box-shadow: 0 4px 12px var(--shadow);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--shadow); }
.btn-primary:active { transform: translateY(0); }
.btn-ai {
  background: var(--accent); color: var(--text);
  font-size: 14px; padding: 10px 16px; border-radius: 12px;
  margin-bottom: 10px; width: 100%;
}

/* 编辑模式 */
.edit-bar { display: none; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.edit-bar.show { display: flex; }
.edit-bar span { font-size: 13px; color: var(--primary); font-weight: 600; }
.btn-cancel {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 13px; border-radius: 10px; padding: 6px 12px;
  background: var(--btn-del); color: var(--btn-del-t);
}

/* ---- 7. 工具栏（标签筛选 + 导出） ---- */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.tag-filter { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.tag-filter-btn {
  border: 1.5px solid var(--border); background: var(--card);
  border-radius: 10px; padding: 5px 11px; font-size: 12px;
  cursor: pointer; font-family: inherit; color: var(--text-l); transition: all 0.2s;
}
.tag-filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tag-filter-btn:hover { opacity: 0.85; }
.btn-export {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 12px; border-radius: 10px; padding: 6px 12px;
  background: var(--accent); color: var(--text); transition: opacity 0.2s;
  white-space: nowrap;
}
.btn-export:hover { opacity: 0.85; }

/* ---- 8. 列表 ---- */
.memo-list { display: flex; flex-direction: column; gap: 12px; }
.memo-item {
  background: var(--bg); border-radius: 18px; padding: 14px 16px;
  box-shadow: inset 0 0 0 1.5px var(--border); transition: opacity 0.25s;
}
.memo-item.done { opacity: 0.6; background: var(--done-bg); }
.memo-item.done .memo-title { text-decoration: line-through; }

.memo-row { display: flex; align-items: flex-start; gap: 10px; }
.memo-check {
  width: 24px; height: 24px; border: 2px solid var(--primary);
  border-radius: 8px; cursor: pointer; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #fff; transition: all 0.2s; background: transparent;
}
.memo-check.checked { background: var(--primary); border-color: var(--primary); }
.memo-content { flex: 1; min-width: 0; }
.memo-title { font-size: 16px; font-weight: 600; color: var(--text); word-break: break-word; }
.memo-desc { font-size: 13px; color: var(--text-l); margin-top: 3px; word-break: break-word; white-space: pre-wrap; }
.memo-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 12px; margin-top: 8px; }

.memo-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.tag-badge {
  font-size: 11px; border-radius: 6px; padding: 2px 8px;
  font-weight: 600; color: #fff;
}
.tag-badge[data-tag="工作"] { background: #5b8def; }
.tag-badge[data-tag="生活"] { background: #34c08a; }
.tag-badge[data-tag="学习"] { background: #b46ee0; }
.tag-badge[data-tag="灵感"] { background: #f0a040; }

.memo-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-mini {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 12px; border-radius: 8px; padding: 5px 12px;
  transition: opacity 0.2s;
}
.btn-edit { background: var(--accent); color: var(--text); }
.btn-del  { background: var(--btn-del); color: var(--btn-del-t); }
.btn-mini:hover { opacity: 0.8; }

/* 空状态 */
.empty { text-align: center; padding: 36px 16px; color: var(--text-l); }
.empty .emoji { font-size: 40px; display: block; margin-bottom: 8px; }

/* ---- 9. 覆盖层 ---- */
.loading-mask {
  position: fixed; inset: 0; background: rgba(255,255,255,0.7);
  z-index: 500; display: none; align-items: center; justify-content: center;
}
.loading-mask.show { display: flex; }
.spinner {
  width: 36px; height: 36px; border: 3.5px solid var(--accent);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: rgba(60,50,30,0.92); color: #fff; border-radius: 12px;
  padding: 10px 18px; font-size: 14px; z-index: 600; opacity: 0;
  transition: all 0.3s ease; pointer-events: none; max-width: 88%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 庆祝弹窗 */
.celebrate {
  position: fixed; inset: 0; z-index: 700; display: none;
  align-items: center; justify-content: center;
  background: rgba(255,243,217,0.6); backdrop-filter: blur(4px);
}
.celebrate.show { display: flex; }
.celebrate-box {
  background: var(--card); border-radius: 28px; padding: 32px 28px;
  text-align: center; max-width: 340px; width: 88%;
  box-shadow: 0 16px 48px var(--shadow);
  animation: pop 0.5s ease;
}
@keyframes pop {
  0%   { transform: scale(0.5); opacity: 0; }
  70%  { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); }
}
.celebrate-box .icon { font-size: 56px; display: block; margin-bottom: 10px; }
.celebrate-box h2 { font-size: 20px; color: var(--text); margin-bottom: 6px; }
.celebrate-box p { font-size: 14px; color: var(--text-l); line-height: 1.6; margin-bottom: 16px; }

/* 撒花动画 */
.confetti-piece {
  position: fixed; width: 8px; height: 8px; z-index: 650;
  pointer-events: none; border-radius: 2px;
  animation: confetti-fall 1.2s ease-out forwards;
}
@keyframes confetti-fall {
  0%   { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
}

/* 登录弹窗 */
.login-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(107,91,62,0.35); z-index: 550;
  align-items: center; justify-content: center;
}
.login-overlay.show { display: flex; }
.login-box {
  background: var(--card); border-radius: 24px; padding: 28px 24px;
  width: 90%; max-width: 360px;
  box-shadow: 0 14px 40px var(--shadow);
}
.login-box h2 { text-align: center; font-size: 20px; color: var(--text); margin-bottom: 6px; }
.login-box .login-sub { text-align: center; font-size: 13px; color: var(--text-l); margin-bottom: 20px; }
.login-box input[type="text"],
.login-box input[type="password"] {
  width: 100%; border: none; outline: none;
  background: var(--bg); border-radius: 14px;
  padding: 12px 14px; font-size: 15px; color: var(--text);
  font-family: inherit; margin-bottom: 12px;
  box-shadow: inset 0 0 0 1.5px var(--border); transition: box-shadow 0.2s;
}
.login-box input:focus { box-shadow: inset 0 0 0 2px var(--primary); }
.login-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.login-tab {
  flex: 1; border: none; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 600; border-radius: 10px;
  padding: 9px; transition: all 0.2s;
}
.login-tab.active { background: linear-gradient(135deg, var(--primary-l), var(--primary)); color: #fff; }
.login-tab:not(.active) { background: var(--bg); color: var(--text-l); }

/* ---- 10. 响应式 ---- */
@media (max-width: 600px) {
  body { padding: 10px 8px 30px; }
  .container { padding: 18px 14px 22px; border-radius: 22px; }
  .header h1 { font-size: 20px; }
  .memo-title { font-size: 15px; }
  .btn-mini { padding: 6px 9px; font-size: 12px; }
  .stat-num { font-size: 18px; }
}
@media (min-width: 768px) {
  body { padding: 30px 16px 60px; }
  .container { padding: 34px 38px 38px; }
}
</style>
</head>

<body>

<!-- ============================================================================
     二、HTML 结构区
     ===================================================================== -->
<div class="container">

  <!-- 顶栏：用户信息 + 主题切换 -->
  <div class="top-bar">
    <div class="user-info" id="userBar" style="display:none;">
      👋 <b id="userName"></b>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
    <div class="theme-switch">
      <div class="theme-dot active" data-t="cream" onclick="setTheme('cream')" title="奶油黄"></div>
      <div class="theme-dot" data-t="pink"  onclick="setTheme('pink')"  title="浅粉"></div>
      <div class="theme-dot" data-t="mint"  onclick="setTheme('mint')"  title="薄荷绿"></div>
    </div>
  </div>

  <!-- 标题区 -->
  <div class="header">
    <h1>📝 懒人备忘录</h1>
    <div class="subtitle">躺平也要记事，琐事不遗漏 ✿</div>
  </div>

  <!-- 统计看板 -->
  <div class="stats-board" id="statsBoard" style="display:none;">
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">📋 总数</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-label">✅ 已完成</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-num" id="statTodo">0</div>
      <div class="stat-label">⏳ 待完成</div>
    </div>
  </div>

  <!-- 输入表单 -->
  <div class="form-card">
    <!-- 编辑提示 -->
    <div class="edit-bar" id="editBar">
      <span>📝 正在编辑...</span>
      <button class="btn-cancel" onclick="exitEditMode()">取消</button>
    </div>

    <!-- AI 生成备忘 -->
    <button class="btn-ai" onclick="generateAIMemo()">✨ AI 帮我生成备忘内容</button>
    <input type="text" id="aiInput" placeholder="输入想法（如：明天要做的事）让AI帮你生成" style="margin-bottom:10px;" />

    <!-- 标题/内容输入 -->
    <input type="text" id="titleInput" maxlength="50" placeholder="备忘标题（如：拿快递）" />
    <textarea id="contentInput" maxlength="500" placeholder="备注内容（选填，可换行）"></textarea>

    <!-- 标签选择 -->
    <div class="tag-row" id="tagPicker">
      <span style="font-size:13px;color:var(--text-l);align-self:center;margin-right:4px;">标签</span>
      <button class="tag-pick" data-tag="工作" onclick="pickTag('工作')">工作</button>
      <button class="tag-pick" data-tag="生活" onclick="pickTag('生活')">生活</button>
      <button class="tag-pick" data-tag="学习" onclick="pickTag('学习')">学习</button>
      <button class="tag-pick" data-tag="灵感" onclick="pickTag('灵感')">灵感</button>
    </div>

    <!-- 图片上传 -->
    <div class="img-upload-row">
      <img class="img-preview" id="imgPreview" alt="预览" />
      <button class="btn-upload" onclick="$('fileInput').click()">📷 上传图片</button>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <!-- 提交按钮 -->
    <button class="btn btn-primary" id="submitBtn" onclick="submitMemo()">＋ 添加备忘</button>
  </div>

  <!-- 工具栏：标签筛选 + 导出 -->
  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="tag-filter">
      <button class="tag-filter-btn active" data-filter="all" onclick="filterTag('all')">全部</button>
      <button class="tag-filter-btn" data-filter="工作" onclick="filterTag('工作')">工作</button>
      <button class="tag-filter-btn" data-filter="生活" onclick="filterTag('生活')">生活</button>
      <button class="tag-filter-btn" data-filter="学习" onclick="filterTag('学习')">学习</button>
      <button class="tag-filter-btn" data-filter="灵感" onclick="filterTag('灵感')">灵感</button>
    </div>
    <button class="btn-export" onclick="exportMemos()">📋 导出全部</button>
  </div>

  <!-- 备忘列表 -->
  <div class="memo-list" id="memoList"></div>

</div>

<!-- 加载遮罩 -->
<div class="loading-mask" id="loadingMask"><div class="spinner"></div></div>
<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<!-- 庆祝弹窗 -->
<div class="celebrate" id="celebrate">
  <div class="celebrate-box">
    <span class="icon">🎉</span>
    <h2>全部搞定啦！</h2>
    <p id="celebrateMsg">太厉害了，所有备忘都完成了～</p>
    <button class="btn btn-primary" onclick="closeCelebrate()">好耶！</button>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>📝 懒人备忘录</h2>
    <div class="login-sub">登录后即可管理你的待办</div>
    <div class="login-tabs">
      <button class="login-tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="login-tab" id="tabReg" onclick="switchTab('register')">注册</button>

async function bmobRequest(method, path, body) {
  const fullPath = BMOB_API_PATH + path;
  const headers = {
    "X-Bmob-Application-Id": APPLICATION_ID,
    "X-Bmob-REST-API-Key": REST_API_KEY,
    "Content-Type": "application/json"
  };
  if (sessionToken) headers["X-Bmob-Session-Token"] = sessionToken;

  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;

  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    try {
      const opts = { method, headers };
      if (body && method !== "GET") opts.body = JSON.stringify(body);
      const resp = await fetch(host + fullPath, opts);
      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }
      if (!resp.ok) throw new Error((data && (data.error || data.message)) || ("HTTP " + resp.status));
      BMOB_WORKING_HOST = host;
      return data;
    } catch (err) {
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

async function uploadImgToBmob(file) {
  const fileName = "memo_" + Date.now() + "_" + file.name;
  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;
  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    const url = host + BMOB_API_PATH + "/files/" + encodeURIComponent(fileName);
    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "X-Bmob-Application-Id": APPLICATION_ID,
          "X-Bmob-REST-API-Key": REST_API_KEY,
          "Content-Type": file.type || "application/octet-stream",
          ...(sessionToken ? { "X-Bmob-Session-Token": sessionToken } : {})
        },
        body: file
      });
      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }
      if (resp.ok && data && data.url) { BMOB_WORKING_HOST = host; return data.url; }
      if (i < hosts.length - 1) continue;
      throw new Error(data && data.error ? data.error : "上传失败");
    } catch (err) {
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

      <div class="empty">
        <span class="emoji">📝</span>
        ${memoList.length === 0 ? '还没有备忘，先记一条吧～<br/>试试 AI 帮你生成！' : '该标签下没有备忘～'}
      </div>`;
    return;
  }

  // 全部完成 → 庆祝弹窗
  const allDone = memoList.length > 0 && memoList.every(m => m.isFinish);
  if (allDone) {
    showCelebrate("太厉害了，所有备忘都完成了～🎉");
  }

  wrap.innerHTML = filtered.map(m => `
    <div class="memo-item ${m.isFinish ? 'done' : ''}" data-id="${m.objectId}">
      <div class="memo-row">
        <div class="memo-check ${m.isFinish ? 'checked' : ''}" onclick="toggleFinish('${m.objectId}', ${!m.isFinish}, this)">
          ${m.isFinish ? '✓' : ''}
        </div>
        <div class="memo-content">
          <div class="memo-title">${escapeHtml(m.title)}</div>
          ${m.content ? `<div class="memo-desc">${escapeHtml(m.content)}</div>` : ''}
          ${m.imgUrl ? `<img class="memo-img" src="${escapeHtml(m.imgUrl)}" alt="图片" loading="lazy" />` : ''}
        </div>
      </div>
      <div class="memo-meta">
        ${m.tag ? `<span class="tag-badge" data-tag="${escapeHtml(m.tag)}">${escapeHtml(m.tag)}</span>` : ''}
      </div>
      <div class="memo-actions">
        <button class="btn-mini btn-edit" onclick="startEdit('${m.objectId}')">编辑</button>
        <button class="btn-mini btn-del" onclick="delMemo('${m.objectId}')">删除</button>
      </div>
    </div>
  `).join("");
}

/* -------------------------------------------------------
   3.11 撒花动画
   ------------------------------------------------------- */

function confetti(x, y) {
  const colors = ["#f0b429", "#ff7eb5", "#34c08a", "#5b8def", "#b46ee0", "#f0a040"];
  for (let i = 0; i < 12; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (x + (Math.random() - 0.5) * 60) + "px";
    piece.style.top = y + "px";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.2) + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1300);
  }
}

/* -------------------------------------------------------
   3.12 操作函数
   ------------------------------------------------------- */

// 提交（新增或更新）
async function submitMemo() {
  const title = $("titleInput").value.trim();
  const content = $("contentInput").value.trim();
  if (!title) { showToast("标题不能为空"); return; }

  showLoading(true);
  try {
    if (editingId) {
      const patch = { title, content };
      if (pendingImgUrl) patch.imgUrl = pendingImgUrl;
      if (selectedTag) patch.tag = selectedTag;
      await updateMemo(editingId, patch);
      const item = memoList.find(m => m.objectId === editingId);
      if (item) { item.title = title; item.content = content; if (pendingImgUrl) item.imgUrl = pendingImgUrl; if (selectedTag) item.tag = selectedTag; }
      showToast("修改成功 ✿");
      exitEditMode();
      renderList();
    } else {
      const newMemo = await createMemo(title, content, pendingImgUrl, selectedTag);
      memoList.unshift(newMemo);
      renderList();
    }
    resetForm();
  } catch (e) {
    showToast("操作失败：" + e.message);
  } finally {
    showLoading(false);
  }
}

// 切换完成状态
async function toggleFinish(id, finish, checkEl) {
  try {
    await updateMemo(id, { isFinish: finish });
    const item = memoList.find(m => m.objectId === id);
    if (item) item.isFinish = finish;
    // 撒花动效：在勾选框位置触发
    if (finish && checkEl) {
      const rect = checkEl.getBoundingClientRect();
      confetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
    renderList();
  } catch (e) {
    showToast("操作失败：" + e.message);
  }
}

// 进入编辑模式
function startEdit(id) {
  const m = memoList.find(x => x.objectId === id);
  if (!m) return;
  editingId = id;
  $("titleInput").value = m.title || "";
  $("contentInput").value = m.content || "";
  $("submitBtn").textContent = "💾 保存修改";
  $("editBar").classList.add("show");
  pendingImgUrl = m.imgUrl || null;
  selectedTag = m.tag || null;
  // 更新标签选中状态
  document.querySelectorAll("#tagPicker .tag-pick").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-tag") === selectedTag);
  });
  if (m.imgUrl) {
    $("imgPreview").src = m.imgUrl;
    $("imgPreview").style.display = "block";
  }
  $("titleInput").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 退出编辑模式
function exitEditMode() {
  editingId = null;
  $("submitBtn").textContent = "＋ 添加备忘";
  $("editBar").classList.remove("show");
  resetForm();
}

// 重置表单
function resetForm() {
  $("titleInput").value = "";
  $("contentInput").value = "";
  $("aiInput").value = "";
  $("imgPreview").style.display = "none";
  $("imgPreview").src = "";
  $("fileInput").value = "";
  pendingImgUrl = null;
  selectedTag = null;
  document.querySelectorAll("#tagPicker .tag-pick").forEach(b => b.classList.remove("active"));
}

// 删除
async function delMemo(id) {
  if (!confirm("确定删除这条备忘吗？")) return;
  try {
    await deleteMemo(id);
    memoList = memoList.filter(m => m.objectId !== id);
    renderList();
    showToast("已删除");
  } catch (e) {
    showToast("删除失败：" + e.message);
  }
}

// 一键导出到剪贴板
function exportMemos() {
  if (memoList.length === 0) { showToast("没有可导出的备忘"); return; }
  const text = memoList.map((m, i) => {
    const status = m.isFinish ? "✅" : "⏳";
    const tag = m.tag ? `[${m.tag}]` : "";
    const content = m.content ? `\n  ${m.content}` : "";
    return `${i + 1}. ${status} ${tag} ${m.title}${content}`;
  }).join("\n\n");

  navigator.clipboard.writeText(text).then(() => {
    showToast("已复制到剪贴板，去粘贴吧 ✿");
  }).catch(() => {
    // 降级方案：用 textarea 选中复制
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("已复制到剪贴板 ✿"); }
    catch (e) { showToast("复制失败，请手动复制"); }
    ta.remove();
  });
}

// 庆祝弹窗
function showCelebrate(msg) {
  $("celebrateMsg").innerHTML = msg;
  $("celebrate").classList.add("show");
}
function closeCelebrate() {
  $("celebrate").classList.remove("show");
}

/* -------------------------------------------------------
   3.13 图片上传处理
   ------------------------------------------------------- */

$("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast("图片不能超过 5MB"); return; }

  const reader = new FileReader();
  reader.onload = (ev) => {
    $("imgPreview").src = ev.target.result;
    $("imgPreview").style.display = "block";
  };
  reader.readAsDataURL(file);

  showLoading(true);
  try {
    const url = await uploadImgToBmob(file);
    pendingImgUrl = url;
    showToast("图片上传成功 ✿");
  } catch (err) {
    showToast("图片上传失败：" + err.message);
    $("imgPreview").style.display = "none";
  } finally {
    showLoading(false);
  }
});

/* -------------------------------------------------------
   3.14 事件监听 & 键盘快捷键
   ------------------------------------------------------- */

$("titleInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("contentInput").focus(); }
});
$("contentInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); $("submitBtn").click();
  }
});
$("loginPass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("loginBtn").click(); }
});

/* -------------------------------------------------------
   3.15 页面初始化
   ------------------------------------------------------- */

(function init() {
  initTheme();
  restoreSession();

  if (currentUser && sessionToken) {
    $("userBar").style.display = "block";
    $("statsBoard").style.display = "flex";
    $("toolbar").style.display = "flex";
    $("userName").textContent = currentUser;
    showLoading(true);
    fetchMemos()
      .catch(e => {
        $("memoList").innerHTML = `
          <div class="empty">
            <span class="emoji">😵</span>
            加载失败：${escapeHtml(e.message)}
            <div style="margin-top:14px;font-size:13px;color:var(--text-l);line-height:1.8;text-align:left;padding:0 10px;">
              <b>💡 排查步骤：</b><br/>
              1. 确认 Bmob 后台 Memo 表字段：title/content/isFinish/imgUrl/username/tag<br/>
              2. 按 F12 查看控制台错误<br/>
              3. 确认网络能访问 api.bmobcloud.com
            </div>
          </div>`;
      })
      .finally(() => showLoading(false));
  } else {
    $("loginOverlay").classList.add("show");
  }
})();

</script>
