<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>懒人备忘录 · 躺平也能记事</title>

<!--
================================================================================
  懒人备忘录 v4.0（单文件版）
  技术栈：原生 HTML + CSS + JavaScript（零框架、零外部依赖）
  后端：Bmob 后端云 REST API（数据库 + 文件存储）
  定位：面向普通学生、上班族的日常待办/琐事记录工具

  ★★★ 手动配置区 ★★★
  请把下面 APPLICATION_ID 和 REST_API_KEY 换成你自己的 Bmob 密钥：
  1. 登录 Bmob 后台 → 设置 → 应用密钥
  2. 复制 Application ID → 填到 APPLICATION_ID
  3. 复制 REST API Key    → 填到 REST_API_KEY

  ★★★ Bmob 后台数据表配置 ★★★
  表名：Memo
  字段：
    title     String    备忘标题
    content   String    备忘内容/备注
    isFinish  Boolean   是否已完成
    imgUrl    String    图片URL（Bmob文件存储返回的链接）
    username  String    创建者用户名（用于用户数据隔离）
    tag       String    标签（工作/生活/学习/灵感，选填）
  注意：imgUrl、username、tag 字段需在 Bmob 后台手动新增，客户端不可见不要勾选。

  ★★★ Bmob 能力使用说明 ★★★
  - 数据库：Memo 表存储备忘录数据（增删改查）
  - 文件存储：上传图片到 Bmob 文件服务，返回 URL 存入 imgUrl 字段
  - 用户系统：注册/登录/会话令牌，实现用户数据隔离

  ★★★ 部署说明 ★★★
  - 本地调试：双击 start-server.bat，通过 http://localhost:8001 访问
  - 公网部署：上传到 Vercel / Netlify / GitHub Pages 即可获得 HTTPS 链接
================================================================================
-->

<style>

   ========================================================================== */

  --accent:    #FF8C42;
  --text:      #1f3b5e;
  --text-l:    #6088b0;
  --border:    #1f3b5e;
  --shadow:    #1f3b5e;

[data-theme="lavender"] {

  --card:      #F5F0FF;
  --primary:   #7b3ff0;
  --primary-l: #b088f5;
  --accent:    #FFC842;
  --text:      #2d1f5e;

/* ---- 2. 基础重置 ---- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px 12px 40px;
  transition: background 0.4s ease, color 0.4s ease;
}
.container {
  max-width: 620px; margin: 0 auto;
  background: var(--card);
  border-radius: 16px; padding: 24px 20px 28px;
  border: 3px solid var(--border);
  box-shadow: 8px 8px 0 var(--shadow);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}

/* ---- 3. 顶栏（用户信息 + 主题切换） ---- */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px; font-size: 13px;
}
.user-info { color: var(--text-l); }
.user-info b { color: var(--text); }
.btn-logout {
  border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 12px; font-weight: 700; border-radius: 6px; padding: 4px 12px;
  background: var(--btn-del); color: var(--btn-del-t); margin-left: 6px;
  box-shadow: 2px 2px 0 var(--shadow);
  transition: all 0.1s;
}
.btn-logout:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn-logout:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--shadow); }
.theme-switch { display: flex; gap: 6px; }
.theme-dot {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer; transition: transform 0.15s;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot[data-t="cream"] { background: #FFE8A0; }
.theme-dot[data-t="pink"]  { background: #FFB8D4; }
.theme-dot[data-t="mint"]  { background: #A0E8C8; }
.theme-dot[data-t="sky"]  { background: #A0D8FF; }
.theme-dot[data-t="lavender"]  { background: #C8B8FF; }
.theme-dot[data-t="coral"]  { background: #FFC8A0; }
.theme-dot.active { border-width: 3px; box-shadow: 2px 2px 0 var(--shadow); }

/* ---- 4. 标题区 ---- */
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 26px; font-weight: 900; color: var(--text); }
.header .subtitle { font-size: 13px; color: var(--text-l); margin-top: 4px; }

/* ---- 5. 统计看板 ---- */
.stats-board {
  display: flex; justify-content: space-around;

  margin-bottom: 16px; border: 3px solid var(--border);

}

.stat-label { font-size: 12px; color: var(--text-l); margin-top: 2px; }
.stat-divider { width: 2px; background: var(--border); margin: 4px 0; opacity: 0.3; }

/* ---- 6. 输入表单 ---- */
.form-card {

  box-shadow: 5px 5px 0 var(--shadow);
}
.form-card input[type="text"],

  font-family: inherit; margin-bottom: 10px;
  transition: box-shadow 0.1s ease;
}
.form-card input:focus,
.form-card textarea:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--shadow); }
.form-card textarea { resize: none; min-height: 56px; }

/* AI 输入行 */
.ai-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ai-row input[type="text"] { margin-bottom: 0; flex: 1; }
.btn-ai {
  border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 800; border-radius: 8px;

}
.btn-ai:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn-ai:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn-ai span { font-size: 13px; }

/* 底部行 */
.form-bottom-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.form-bottom-row .tag-row { flex: 1; margin-bottom: 0; }

/* 图片上传 */
.img-upload-mini { position: relative; flex-shrink: 0; }
.img-upload-mini .img-preview {
  width: 36px; height: 36px; border-radius: 8px; object-fit: cover;
  border: 2px solid var(--border); display: none; position: absolute;
  right: 44px; top: 0; z-index: 1;
}
.img-upload-mini .img-preview.show { display: block; }
.btn-upload {
  border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 18px; border-radius: 8px; padding: 5px 10px;
  background: var(--accent); color: #fff; transition: all 0.1s; line-height: 1;
  box-shadow: 2px 2px 0 var(--shadow);
}
.btn-upload:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn-upload:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* 标签选择 */
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-pick {
  border: 2px solid var(--border); background: var(--card);
  border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600;

  box-shadow: 2px 2px 0 var(--shadow);
}
.tag-pick.active { background: var(--primary); color: #fff; }
.tag-pick:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.tag-pick:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* 按钮 */
.btn {
  border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 800; border-radius: 8px;

}
.btn-primary {

}
.btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--shadow); }
.btn-primary:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }

/* 编辑模式 */

}
.btn-cancel:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn-cancel:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* ---- 7. 工具栏（标签筛选 + 导出） ---- */
.toolbar {

}
.tag-filter { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.tag-filter-btn {

}
.tag-filter-btn.active { background: var(--primary); color: #fff; }
.tag-filter-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.tag-filter-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }
.btn-export {
  border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 12px; font-weight: 700; border-radius: 8px; padding: 6px 14px;
  background: var(--accent); color: #fff;
  transition: all 0.1s; white-space: nowrap;
  box-shadow: 2px 2px 0 var(--shadow);
}
.btn-export:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn-export:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* ---- 8. 列表 ---- */
.memo-list { display: flex; flex-direction: column; gap: 12px; }
.memo-item {

  border: 3px solid var(--border); transition: opacity 0.25s;
  box-shadow: 4px 4px 0 var(--shadow);
}
.memo-item.done { opacity: 0.55; background: var(--done-bg); }

.memo-row { display: flex; align-items: flex-start; gap: 10px; }
.memo-check {

  font-size: 14px; color: #fff; transition: all 0.15s; background: transparent;

.memo-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 12px; margin-top: 8px; }

.memo-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; }

  font-size: 11px; border-radius: 6px; padding: 2px 8px;

.tag-badge[data-tag="工作"] { background: #5b8def; }
.tag-badge[data-tag="生活"] { background: #34c08a; }
.tag-badge[data-tag="学习"] { background: #b46ee0; }
.tag-badge[data-tag="灵感"] { background: #f0a040; }

.memo-actions { display: flex; gap: 6px; margin-top: 8px; }
.btn-mini {

  transition: all 0.1s;
}
.btn-edit { background: var(--accent); color: #fff; box-shadow: 2px 2px 0 var(--shadow); }
.btn-del  { background: var(--btn-del); color: var(--btn-del-t); margin-left: auto; box-shadow: 2px 2px 0 var(--shadow); }
.btn-mini:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn-mini:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* 空状态 */
.empty { text-align: center; padding: 36px 16px; color: var(--text-l); }
.empty .emoji { font-size: 40px; display: block; margin-bottom: 8px; }

/* ---- 9. 覆盖层 ---- */
.loading-mask {
  position: fixed; inset: 0; background: rgba(255,255,255,0.7);
  z-index: 500; display: none; align-items: center; justify-content: center;
}
.loading-mask.show { display: flex; }
.spinner {
  width: 36px; height: 36px; border: 3.5px solid var(--accent);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: rgba(60,50,30,0.92); color: #fff; border-radius: 12px;
  padding: 10px 18px; font-size: 14px; z-index: 600; opacity: 0;
  transition: all 0.3s ease; pointer-events: none; max-width: 88%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 庆祝弹窗 */
.celebrate {
  position: fixed; inset: 0; z-index: 700; display: none;
  align-items: center; justify-content: center;
  background: rgba(255,243,217,0.6); backdrop-filter: blur(4px);
}
.celebrate.show { display: flex; }
.celebrate-box {
  background: var(--card); border-radius: 28px; padding: 32px 28px;
  text-align: center; max-width: 340px; width: 88%;
  box-shadow: 0 16px 48px var(--shadow);
  animation: pop 0.5s ease;
}
@keyframes pop {
  0%   { transform: scale(0.5); opacity: 0; }
  70%  { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); }
}
.celebrate-box .icon { font-size: 56px; display: block; margin-bottom: 10px; }
.celebrate-box h2 { font-size: 20px; color: var(--text); margin-bottom: 6px; }
.celebrate-box p { font-size: 14px; color: var(--text-l); line-height: 1.6; margin-bottom: 16px; }

/* 撒花动画 */
.confetti-piece {
  position: fixed; width: 8px; height: 8px; z-index: 650;
  pointer-events: none; border-radius: 2px;
  animation: confetti-fall 1.2s ease-out forwards;
}
@keyframes confetti-fall {
  0%   { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
}

/* 登录弹窗 */
.login-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(107,91,62,0.35); z-index: 550;
  align-items: center; justify-content: center;
}
.login-overlay.show { display: flex; }
.login-box {
  background: var(--card); border-radius: 16px; padding: 28px 24px;
  width: 90%; max-width: 360px;
  border: 3px solid var(--border);
  box-shadow: 8px 8px 0 var(--shadow);
}
.login-box h2 { text-align: center; font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
.login-box .login-sub { text-align: center; font-size: 13px; color: var(--text-l); margin-bottom: 20px; }
.login-box input[type="text"],
.login-box input[type="password"] {
  width: 100%; border: 2px solid var(--border); outline: none;
  background: var(--bg); border-radius: 8px;
  padding: 12px 14px; font-size: 15px; color: var(--text);
  font-family: inherit; margin-bottom: 12px;
  transition: box-shadow 0.1s;
}
.login-box input:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--shadow); }
.login-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.login-tab {
  flex: 1; border: 2px solid var(--border); cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 800; border-radius: 8px;
  padding: 9px; transition: all 0.1s;
  box-shadow: 2px 2px 0 var(--shadow);
}
.login-tab.active { background: var(--primary); color: #fff; }
.login-tab:not(.active) { background: var(--card); color: var(--text-l); }
.login-tab:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.login-tab:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

/* ---- 10. 响应式 ---- */
@media (max-width: 600px) {
  body { padding: 10px 8px 30px; }
  .container { padding: 18px 14px 22px; border-radius: 22px; }
  .header h1 { font-size: 20px; }
  .memo-title { font-size: 15px; }
  .btn-mini { padding: 6px 12px; font-size: 12px; }
  .stat-num { font-size: 18px; }
}
@media (min-width: 768px) {
  body { padding: 30px 16px 60px; }
  .container { padding: 34px 38px 38px; }
}
</style>
</head>

<!-- ============================================================================
     二、HTML 结构区
     ===================================================================== -->
<div class="container">

  <!-- 顶栏：用户信息 + 主题切换 -->

    <div class="user-info" id="userBar" style="display:none;">
      👋 <b id="userName"></b>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
    <div class="theme-switch">
      <div class="theme-dot active" data-t="cream" onclick="setTheme('cream')" title="奶油黄"></div>
      <div class="theme-dot" data-t="pink"  onclick="setTheme('pink')"  title="蜜桃粉"></div>
      <div class="theme-dot" data-t="mint"  onclick="setTheme('mint')"  title="薄荷绿"></div>

async function bmobRequest(method, path, body) {
  const fullPath = BMOB_API_PATH + path;
  const headers = {
    "X-Bmob-Application-Id": APPLICATION_ID,
    "X-Bmob-REST-API-Key": REST_API_KEY,
    "Content-Type": "application/json"
  };
  if (sessionToken) headers["X-Bmob-Session-Token"] = sessionToken;

  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;

  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    try {
      const opts = { method, headers };
      if (body && method !== "GET") opts.body = JSON.stringify(body);
      const resp = await fetch(host + fullPath, opts);
      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }
      if (!resp.ok) throw new Error((data && (data.error || data.message)) || ("HTTP " + resp.status));
      BMOB_WORKING_HOST = host;
      return data;
    } catch (err) {
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

async function uploadImgToBmob(file) {
  const fileName = "memo_" + Date.now() + "_" + file.name;
  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;
  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    const url = host + BMOB_API_PATH + "/files/" + encodeURIComponent(fileName);
    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "X-Bmob-Application-Id": APPLICATION_ID,
          "X-Bmob-REST-API-Key": REST_API_KEY,
          "Content-Type": file.type || "application/octet-stream",
          ...(sessionToken ? { "X-Bmob-Session-Token": sessionToken } : {})
        },
        body: file
      });
      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }
      if (resp.ok && data && data.url) { BMOB_WORKING_HOST = host; return data.url; }
      if (i < hosts.length - 1) continue;
      throw new Error(data && data.error ? data.error : "上传失败");
    } catch (err) {
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

/**
 * AI 语义分析引擎
 * 真正读懂用户输入，动态生成有针对性的结构化内容
 * 每一步都引用用户的原话关键词，形成逻辑闭环
 */
function analyzeAndGenerate(rawInput) {
  const text = rawInput.trim();

  // === 1. 提取核心关键词（作为后续引用的"锚"） ===
  let core = text;
  for (const t of TIME_MAP) {
    for (const w of t.words) {
      core = core.replace(new RegExp(w, 'g'), '');
    }
  }
  // 去掉常见语气助词和代词
  core = core.replace(/[。，！？,.!?吧呢啊呀哦了的要去给我帮我一下一下子下一个一下]/g, '').trim();
  if (core.length < 2) core = text.trim();
  if (core.length > 8) core = core.slice(0, 8) + '…';

  // === 2. 识别意图 ===
  let intent = "action";
  let matchedVerb = "";
  for (const val of INTENT_MAP) {
    for (const verb of val.verbs) {
      if (text.includes(verb)) {
        intent = val.name;
        matchedVerb = verb;
        break;
      }
    }
    if (matchedVerb) break;
  }

  // === 3. AI 开场回应（随机选一条，像在跟用户对话） ===
  const intentConfig = INTENT_MAP.find(v => v.name === intent);
  const reactList = intentConfig ? intentConfig.react : [];
  const react = reactList.length > 0
    ? reactList[Math.floor(Math.random() * reactList.length)]
    : "好的，让我们来搞定这件事！";

  // === 4. 识别时间词 ===
  let timeTip = "";
  for (const t of TIME_MAP) {
    if (t.words.some(w => text.includes(w))) {
      timeTip = t.tip;
      break;
    }
  }

  // === 5. 动态生成5步行动清单（每步都引用核心关键词） ===
  const templates = STEP_TEMPLATES[intent];
  const steps = templates.map((tpl, i) => {
    let step = tpl.replace("{obj}", core);
    if (i === 0 && Math.random() > 0.5) {
      step = "🎯 " + step;
    }
    return step;
  });

  // === 6. 随机选一条小贴士 ===
  const tips = TIPS[intent];
  const tip = tips[Math.floor(Math.random() * tips.length)];

  // === 7. 拼装最终内容（有对话感 + 结构感） ===
  let content = `🗣️ ${react}\n\n📋 行动计划：\n`;
  content += steps.map((s, i) => `${i + 1}. ${s}`).join("\n");
  if (timeTip) {
    content += `\n\n⏰ 时间建议：${timeTip}`;
  }
  content += `\n\n💡 ${tip.replace("{obj}", core)}`;

  // === 8. 生成标题（直接引用用户原话） ===
  const title = text.length > 12 ? text.slice(0, 12) + "…" : text;

  // === 9. 推断标签 ===
  const tag = intentConfig ? intentConfig.tag : null;

  return { title, content, tag };
}

/**
 * AI 生成备忘内容（语义分析版）
 * 对用户输入进行意图识别+实体提取，动态生成针对性内容
 */
function generateAIMemo() {
  const idea = $("aiInput").value.trim();
  if (!idea) { showToast("先在上方输入框写个想法～"); return; }

  showLoading(true);
  setTimeout(() => {
    showLoading(false);
    const { title, content, tag } = analyzeAndGenerate(idea);
    $("titleInput").value = title;
    $("contentInput").value = content;
    if (tag) pickTag(tag);
    showToast("AI 已分析你的需求，生成结构化内容 ✿");
  }, 900);
}

/* -------------------------------------------------------
   3.7 状态变量 & 标签系统
   ------------------------------------------------------- */

let memoList = [];
let editingId = null;
let pendingImgUrl = null;
let selectedTag = null;        // 表单选中的标签
let activeFilter = "all";     // 列表筛选标签
let isInitialLoad = true;     // 标记是否为首次加载（防止庆祝弹窗在刷新时重复弹出）

/** 表单中选择标签 */
function pickTag(tag) {
  // 再次点击取消选中
  selectedTag = (selectedTag === tag) ? null : tag;
  document.querySelectorAll("#tagPicker .tag-pick").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-tag") === selectedTag);
  });
}

/** 列表筛选标签 */
function filterTag(tag) {
  activeFilter = tag;
  document.querySelectorAll(".tag-filter-btn").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-filter") === tag);
  });
  renderList();
}

/* -------------------------------------------------------
   3.8 数据操作
   ------------------------------------------------------- */

/** 查询当前用户的备忘 */
async function fetchMemos() {
  const where = JSON.stringify({ username: currentUser });
  const data = await bmobRequest("GET",
    "/classes/" + TABLE_NAME + "?where=" + encodeURIComponent(where) + "&order=-createdAt", null);
  memoList = data.results || [];
  renderList();
}

/** 新增备忘（返回完整对象） */
async function createMemo(title, content, imgUrl, tag) {
  const body = { title, content, isFinish: false, username: currentUser };
  if (imgUrl) body.imgUrl = imgUrl;
  if (tag) body.tag = tag;
  const data = await bmobRequest("POST", "/classes/" + TABLE_NAME, body);
  showToast("备忘已添加 ✿");
  return { objectId: data.objectId, title, content, isFinish: false,
           imgUrl: imgUrl || null, username: currentUser, tag: tag || null, createdAt: data.createdAt };
}

/** 修改备忘 */
async function updateMemo(id, patch) {
  await bmobRequest("PUT", "/classes/" + TABLE_NAME + "/" + id, patch);
}

/** 删除备忘 */
async function deleteMemo(id) {
  await bmobRequest("DELETE", "/classes/" + TABLE_NAME + "/" + id, null);
}

/* -------------------------------------------------------
   3.9 统计看板更新
   ------------------------------------------------------- */

function updateStats() {
  const total = memoList.length;
  const done = memoList.filter(m => m.isFinish).length;
  const todo = total - done;
  $("statTotal").textContent = total;
  $("statDone").textContent = done;
  $("statTodo").textContent = todo;
}

/* -------------------------------------------------------
   3.10 渲染列表
   ------------------------------------------------------- */

function renderList() {
  updateStats();
  const wrap = $("memoList");

  // 按标签筛选
  const filtered = (activeFilter === "all")
    ? memoList
    : memoList.filter(m => m.tag === activeFilter);

  if (filtered.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <span class="emoji">📝</span>
        ${memoList.length === 0 ? '还没有备忘，先记一条吧～<br/>试试 AI 帮你生成！' : '该标签下没有备忘～'}
      </div>`;
    return;
  }

  // 全部完成 → 庆祝弹窗（仅用户主动操作时触发，刷新页面不弹）
  const allDone = memoList.length > 0 && memoList.every(m => m.isFinish);
  if (allDone && !isInitialLoad) {
    showCelebrate("太厉害了，所有备忘都完成了～🎉");
  }

  wrap.innerHTML = filtered.map(m => `
    <div class="memo-item ${m.isFinish ? 'done' : ''}" data-id="${m.objectId}">
      <div class="memo-row">
        <div class="memo-check ${m.isFinish ? 'checked' : ''}" onclick="toggleFinish('${m.objectId}', ${!m.isFinish}, this)">
          ${m.isFinish ? '✓' : ''}
        </div>
        <div class="memo-content">
          <div class="memo-title">${escapeHtml(m.title)}</div>
          ${m.content ? `<div class="memo-desc">${escapeHtml(m.content)}</div>` : ''}
          ${m.imgUrl ? `<img class="memo-img" src="${escapeHtml(m.imgUrl)}" alt="图片" loading="lazy" />` : ''}
        </div>
      </div>
      <div class="memo-meta">
        ${m.tag ? `<span class="tag-badge" data-tag="${escapeHtml(m.tag)}">${escapeHtml(m.tag)}</span>` : ''}
      </div>
      <div class="memo-actions">
        <button class="btn-mini btn-edit" onclick="startEdit('${m.objectId}')">编辑</button>
        <button class="btn-mini btn-del" onclick="delMemo('${m.objectId}')">删除</button>
      </div>
    </div>
  `).join("");
}

/* -------------------------------------------------------
   3.11 撒花动画
   ------------------------------------------------------- */

function confetti(x, y) {
  const colors = ["#f0b429", "#ff7eb5", "#34c08a", "#5b8def", "#b46ee0", "#f0a040"];
  for (let i = 0; i < 12; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (x + (Math.random() - 0.5) * 60) + "px";
    piece.style.top = y + "px";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.2) + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1300);
  }
}

/* -------------------------------------------------------
   3.12 操作函数
   ------------------------------------------------------- */

// 提交（新增或更新）
async function submitMemo() {
  const title = $("titleInput").value.trim();
  const content = $("contentInput").value.trim();
  if (!title) { showToast("标题不能为空"); return; }

  showLoading(true);
  try {
    if (editingId) {
      const patch = { title, content };
      if (pendingImgUrl) patch.imgUrl = pendingImgUrl;
      if (selectedTag) patch.tag = selectedTag;
      await updateMemo(editingId, patch);
      const item = memoList.find(m => m.objectId === editingId);
      if (item) { item.title = title; item.content = content; if (pendingImgUrl) item.imgUrl = pendingImgUrl; if (selectedTag) item.tag = selectedTag; }
      showToast("修改成功 ✿");
      exitEditMode();
      renderList();
    } else {
      const newMemo = await createMemo(title, content, pendingImgUrl, selectedTag);
      memoList.unshift(newMemo);
      renderList();
    }
    resetForm();
  } catch (e) {
    showToast("操作失败：" + e.message);
  } finally {
    showLoading(false);
  }
}

// 切换完成状态
async function toggleFinish(id, finish, checkEl) {
  try {
    await updateMemo(id, { isFinish: finish });
    const item = memoList.find(m => m.objectId === id);
    if (item) item.isFinish = finish;
    // 撒花动效：在勾选框位置触发
    if (finish && checkEl) {
      const rect = checkEl.getBoundingClientRect();
      confetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
    renderList();
  } catch (e) {
    showToast("操作失败：" + e.message);
  }
}

// 进入编辑模式
function startEdit(id) {
  const m = memoList.find(x => x.objectId === id);
  if (!m) return;
  editingId = id;
  $("titleInput").value = m.title || "";
  $("contentInput").value = m.content || "";
  $("submitBtn").textContent = "💾 保存修改";
  $("editBar").classList.add("show");
  pendingImgUrl = m.imgUrl || null;
  selectedTag = m.tag || null;
  // 更新标签选中状态
  document.querySelectorAll("#tagPicker .tag-pick").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-tag") === selectedTag);
  });
  if (m.imgUrl) {
    $("imgPreview").src = m.imgUrl;
    $("imgPreview").classList.add("show");
  }
  $("titleInput").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 退出编辑模式
function exitEditMode() {
  editingId = null;
  $("submitBtn").textContent = "＋ 添加备忘";
  $("editBar").classList.remove("show");
  resetForm();
}

// 重置表单
function resetForm() {
  $("titleInput").value = "";
  $("contentInput").value = "";
  $("aiInput").value = "";
  $("imgPreview").classList.remove("show");
  $("imgPreview").src = "";
  $("fileInput").value = "";
  pendingImgUrl = null;
  selectedTag = null;
  document.querySelectorAll("#tagPicker .tag-pick").forEach(b => b.classList.remove("active"));
}

// 删除
async function delMemo(id) {
  if (!confirm("确定删除这条备忘吗？")) return;
  try {
    await deleteMemo(id);
    memoList = memoList.filter(m => m.objectId !== id);
    renderList();
    showToast("已删除");
  } catch (e) {
    showToast("删除失败：" + e.message);
  }
}

// 一键导出到剪贴板
function exportMemos() {
  if (memoList.length === 0) { showToast("没有可导出的备忘"); return; }
  const text = memoList.map((m, i) => {
    const status = m.isFinish ? "✅" : "⏳";
    const tag = m.tag ? `[${m.tag}]` : "";
    const content = m.content ? `\n  ${m.content}` : "";
    return `${i + 1}. ${status} ${tag} ${m.title}${content}`;
  }).join("\n\n");

  navigator.clipboard.writeText(text).then(() => {
    showToast("已复制到剪贴板，去粘贴吧 ✿");
  }).catch(() => {
    // 降级方案：用 textarea 选中复制
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("已复制到剪贴板 ✿"); }
    catch (e) { showToast("复制失败，请手动复制"); }
    ta.remove();
  });
}

// 庆祝弹窗
function showCelebrate(msg) {
  $("celebrateMsg").innerHTML = msg;
  $("celebrate").classList.add("show");
}
function closeCelebrate() {
  $("celebrate").classList.remove("show");
}

/* -------------------------------------------------------
   3.13 图片上传处理
   ------------------------------------------------------- */

$("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast("图片不能超过 5MB"); return; }

  const reader = new FileReader();
  reader.onload = (ev) => {
    $("imgPreview").src = ev.target.result;
    $("imgPreview").classList.add("show");
  };
  reader.readAsDataURL(file);

  showLoading(true);
  try {
    const url = await uploadImgToBmob(file);
    pendingImgUrl = url;
    showToast("图片上传成功 ✿");
  } catch (err) {
    showToast("图片上传失败：" + err.message);
    $("imgPreview").classList.remove("show");
  } finally {
    showLoading(false);
  }
});

/* -------------------------------------------------------
   3.14 事件监听 & 键盘快捷键
   ------------------------------------------------------- */

$("titleInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("contentInput").focus(); }
});
$("contentInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); $("submitBtn").click();
  }
});
$("loginPass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("loginBtn").click(); }
});

/* -------------------------------------------------------
   3.15 页面初始化
   ------------------------------------------------------- */

// 清空浏览器自动填充到备忘输入框的内容
// Chrome 等浏览器会在页面加载后 300-500ms 自动填充保存的用户名/密码
// 我们在多个时间点清空，确保不会污染用户的输入框
function clearAutoFill() {
  $("aiInput").value = "";
  $("titleInput").value = "";
  $("contentInput").value = "";
  $("loginUser").value = "";
  $("loginPass").value = "";
  // 诱饵框也清掉（吸收了自动填充的用户名密码）
  const decoyU = $("decoyUser");
  const decoyP = $("decoyPass");
  if (decoyU) decoyU.value = "";
  if (decoyP) decoyP.value = "";
}

(function init() {
  initTheme();
  // 多次延迟清空：覆盖浏览器（特别是 Chrome）自动填充的注入时机（300-500ms）
  // 第一次：立即清
  clearAutoFill();
  // 第二次：300ms 后清（Chrome 自动填充的典型注入时间）
  setTimeout(clearAutoFill, 300);
  // 第三次：600ms 后再清一次，确保万无一失
  setTimeout(clearAutoFill, 600);
  restoreSession();

  if (currentUser && sessionToken) {
    $("userBar").style.display = "block";
    $("statsBoard").style.display = "flex";
    $("toolbar").style.display = "flex";
    $("userName").textContent = currentUser;
    showLoading(true);
    fetchMemos()
      .then(() => {
        // 首次加载完成，后续操作才触发庆祝弹窗
        isInitialLoad = false;
      })
      .catch(e => {
        // session token 失效 → 清除登录态，弹出登录页
        if (e.message.includes("session") || e.message.includes("101") || e.message.includes("401")) {
          clearSession();
          $("userBar").style.display = "none";
          $("statsBoard").style.display = "none";
          $("toolbar").style.display = "none";
          $("loginOverlay").classList.add("show");
          showToast("登录已过期，请重新登录");
        } else {
          $("memoList").innerHTML = `
            <div class="empty">
              <span class="emoji">😵</span>
              加载失败：${escapeHtml(e.message)}
              <div style="margin-top:14px;font-size:13px;color:var(--text-l);line-height:1.8;text-align:left;padding:0 10px;">
                <b>💡 排查步骤：</b><br/>
                1. 确认 Bmob 后台 Memo 表字段：title/content/isFinish/imgUrl/username/tag<br/>
                2. 按 F12 查看控制台错误<br/>
                3. 确认网络能访问 api.bmobcloud.com
              </div>
            </div>`;
        }
      })
      .finally(() => showLoading(false));
  } else {
    $("loginOverlay").classList.add("show");
  }
})();

</script>
