<!--
================================================================================
  小云懒人备忘录 v3.0（单文件版）
  技术栈：原生 HTML + CSS + JavaScript（零框架、零外部依赖）
  后端：Bmob 后端云 REST API（数据库 + 文件存储）
  定位：面向普通学生、上班族的日常待办/琐事记录工具

  ★★★ 手动配置区 ★★★
  请把下面 APPLICATION_ID 和 REST_API_KEY 换成你自己的 Bmob 密钥：
  1. 登录 Bmob 后台 → 设置 → 应用密钥
  2. 复制 Application ID → 填到 APPLICATION_ID
  3. 复制 REST API Key    → 填到 REST_API_KEY

  ★★★ Bmob 后台数据表配置 ★★★
  表名：Memo
  字段：
    title     String    备忘标题
    content   String    备忘内容/备注
    isFinish  Boolean   是否已完成
    imgUrl    String    图片URL（Bmob文件存储返回的链接）
    username  String    创建者用户名（用于用户数据隔离）
  注意：imgUrl 和 username 字段需在 Bmob 后台手动新增，客户端不可见不要勾选。

  ★★★ Bmob 能力使用说明 ★★★
  - 数据库：Memo 表存储备忘录数据（增删改查）
  - 文件存储：上传图片到 Bmob 文件服务，返回 URL 存入 imgUrl 字段
  - 用户系统：注册/登录/会话令牌，实现用户数据隔离

  ★★★ 部署说明 ★★★
  - 本地调试：双击 start-server.bat，通过 http://localhost:8001 访问
  - 公网部署：上传到 Vercel / Netlify / GitHub Pages 即可获得 HTTPS 链接
================================================================================
-->

<style>
/* ==========================================================================

</style>

<script>
"use strict";

/* ==========================================================================
   三、JavaScript 逻辑区
   ========================================================================== */

/* -------------------------------------------------------
   3.1 Bmob 配置区（★★★ 手动填入你的密钥 ★★★）
   ------------------------------------------------------- */

// ▼▼▼ 请替换为你自己的 Bmob 密钥 ▼▼▼
const APPLICATION_ID = "6dd518b7fba75a11b75f9863883616a9";
const REST_API_KEY   = "9099ac88fc936a9ea14cff5e0844ac30";
// ▲▲▲ 请替换为你自己的 Bmob 密钥 ▲▲▲

const TABLE_NAME     = "Memo";

// Bmob API 域名列表（按优先级排序，自动探测可用域名）
const BMOB_API_HOSTS = [
  "https://api.bmobcloud.com",
  "https://api.bmobapp.com",
  "https://api.bmob.cn"
];
const BMOB_API_PATH = "/1";
let BMOB_WORKING_HOST = null;

/* -------------------------------------------------------
   3.2 用户认证系统
   ★★★ Bmob 后台 Memo 表需新增 username 字段（String），用于按用户筛选数据
   ------------------------------------------------------- */

let currentUser = null;
let sessionToken = null;

// 从 sessionStorage 恢复登录状态
function restoreSession() {
  const saved = sessionStorage.getItem("bmob_session");
  if (saved) {
    try {
      const obj = JSON.parse(saved);
      currentUser = obj.username;
      sessionToken = obj.sessionToken;
    } catch (e) {}
  }
}

function saveSession(username, token) {
  currentUser = username;
  sessionToken = token;
  sessionStorage.setItem("bmob_session", JSON.stringify({
    username: username, sessionToken: token
  }));
}

function clearSession() {
  currentUser = null;
  sessionToken = null;
  sessionStorage.removeItem("bmob_session");
}

// 切换登录/注册标签
function switchTab(mode) {
  const isLogin = (mode === "login");
  $("tabLogin").classList.toggle("active", isLogin);
  $("tabReg").classList.toggle("active", !isLogin);
  $("loginBtn").textContent = isLogin ? "登录" : "注册";
  $("loginBtn").onclick = isLogin ? doLogin : doRegister;
}

// 注册新用户
async function doRegister() {
  const username = $("loginUser").value.trim();
  const password = $("loginPass").value.trim();
  if (username.length < 3) { showToast("用户名至少 3 位"); return; }
  if (password.length < 6) { showToast("密码至少 6 位"); return; }

  showLoading(true);
  try {
    const data = await bmobRequest("POST", "/users", { username, password });
    if (data.sessionToken) {
      saveSession(username, data.sessionToken);
      onLoginSuccess();
      showToast("注册成功，欢迎加入 ✿");
    }
  } catch (e) {
    showToast(e.message);
  } finally {
    showLoading(false);
  }
}

// 登录
async function doLogin() {
  const username = $("loginUser").value.trim();
  const password = $("loginPass").value.trim();
  if (!username || !password) { showToast("请输入用户名和密码"); return; }

  showLoading(true);
  try {
    const data = await bmobRequest("GET",
      "/login?username=" + encodeURIComponent(username) +
      "&password=" + encodeURIComponent(password), null);
    if (data.sessionToken) {
      saveSession(data.username, data.sessionToken);
      onLoginSuccess();
      showToast("登录成功 ✿");
    }
  } catch (e) {
    showToast(e.message);
  } finally {
    showLoading(false);
  }
}

// 登录成功
function onLoginSuccess() {
  $("loginOverlay").classList.remove("show");
  $("userBar").style.display = "block";

const $ = (id) => document.getElementById(id);

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 3000);
}

function showLoading(show) {

function escapeHtml(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

/* -------------------------------------------------------
   3.5 Bmob 请求引擎（多域名降级 + session token）
   ------------------------------------------------------- */

/**
 * 统一 Bmob REST API 请求函数
 * @param {string} method - GET / POST / PUT / DELETE
 * @param {string} path   - API 路径（如 /classes/Memo）
 * @param {object} body   - 请求体（可选）
 */
async function bmobRequest(method, path, body) {
  const fullPath = BMOB_API_PATH + path;
  const headers = {
    "X-Bmob-Application-Id": APPLICATION_ID,
    "X-Bmob-REST-API-Key": REST_API_KEY,
    "Content-Type": "application/json"
  };
  // 已登录用户附带会话令牌
  if (sessionToken) {
    headers["X-Bmob-Session-Token"] = sessionToken;
  }

  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;

  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    const url = host + fullPath;
    try {
      const opts = { method, headers };
      if (body && method !== "GET") opts.body = JSON.stringify(body);

      const resp = await fetch(url, opts);
      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }

      if (!resp.ok) {
        const errMsg = (data && (data.error || data.message)) || ("HTTP " + resp.status);
        throw new Error(errMsg);
      }
      BMOB_WORKING_HOST = host;
      return data;

    } catch (err) {
      // 网络错误或 CORS 失败，尝试下一个域名
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

/**
 * 上传图片到 Bmob 文件存储
 * 调用 POST /1/files/{filename}
 * ★★★ 此函数使用 Bmob【文件存储】能力 ★★★
 */
async function uploadImgToBmob(file) {
  const fileName = "memo_" + Date.now() + "_" + file.name;
  const hosts = BMOB_WORKING_HOST ? [BMOB_WORKING_HOST] : BMOB_API_HOSTS;

  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    const url = host + BMOB_API_PATH + "/files/" + encodeURIComponent(fileName);

    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "X-Bmob-Application-Id": APPLICATION_ID,
          "X-Bmob-REST-API-Key": REST_API_KEY,
          "Content-Type": file.type || "application/octet-stream",
          ...(sessionToken ? { "X-Bmob-Session-Token": sessionToken } : {})
        },
        body: file
      });

      let data = null;
      const text = await resp.text();
      if (text) { try { data = JSON.parse(text); } catch (e) {} }

      if (resp.ok && data && data.url) {
        BMOB_WORKING_HOST = host;
        return data.url;
      }
      if (i < hosts.length - 1) continue;
      throw new Error(data && data.error ? data.error : "上传失败");
    } catch (err) {
      if (i < hosts.length - 1) continue;
      throw err;
    }
  }
}

/* -------------------------------------------------------
   3.8 状态变量 & 数据操作
   ------------------------------------------------------- */

let memoList = [];
let editingId = null;
let pendingImgUrl = null;

/** 查询当前用户的备忘（按时间倒序，按 username 筛选） */
async function fetchMemos() {
  const where = JSON.stringify({ username: currentUser });
  const data = await bmobRequest("GET",
    "/classes/" + TABLE_NAME + "?where=" + encodeURIComponent(where) + "&order=-createdAt", null);
  memoList = data.results || [];
  renderList();
}

/** 新增备忘（返回创建后的完整对象） */
async function createMemo(title, content, imgUrl) {
  const body = { title, content, isFinish: false, username: currentUser };
  if (imgUrl) body.imgUrl = imgUrl;
  const data = await bmobRequest("POST", "/classes/" + TABLE_NAME, body);
  showToast("备忘已添加 ✿");
  // 返回新对象（Bmob POST 返回 objectId + createdAt）
  return { objectId: data.objectId, title, content, isFinish: false,
           imgUrl: imgUrl || null, username: currentUser, createdAt: data.createdAt };
}

/** 修改备忘 */
async function updateMemo(id, patch) {
  await bmobRequest("PUT", "/classes/" + TABLE_NAME + "/" + id, patch);
}

/** 删除备忘 */
async function deleteMemo(id) {
  await bmobRequest("DELETE", "/classes/" + TABLE_NAME + "/" + id, null);
}

/* -------------------------------------------------------
   3.9 渲染列表
   ------------------------------------------------------- */

function renderList() {
  const wrap = $("memoList");

  if (memoList.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <span class="emoji">☁️</span>
        还没有备忘，先记一条吧～<br/>
        试试 AI 帮你生成！
      </div>`;
    return;
  }

  // 全部完成 → 庆祝彩蛋
  const allDone = memoList.every(m => m.isFinish);
  if (allDone) {
    showCelebrate("太厉害了，所有备忘都完成了～<br/>小云说你是效率小能手！☁️✨");
  }

  // 待办太多 → 小云摆烂提示
  const unfinished = memoList.filter(m => !m.isFinish);
  if (unfinished.length >= 8) {
    cloudSay("这么多待办...小云选择躺平 ☁️");
  }

  wrap.innerHTML = memoList.map(m => `
    <div class="memo-item ${m.isFinish ? 'done' : ''}" data-id="${m.objectId}">
      <div class="memo-row">
        <div class="memo-check ${m.isFinish ? 'checked' : ''}" onclick="toggleFinish('${m.objectId}', ${!m.isFinish})">
          ${m.isFinish ? '✓' : ''}
        </div>
        <div class="memo-content">
          <div class="memo-title">${escapeHtml(m.title)}</div>
          ${m.content ? `<div class="memo-desc">${escapeHtml(m.content)}</div>` : ''}
          ${m.imgUrl ? `<img class="memo-img" src="${escapeHtml(m.imgUrl)}" alt="图片" loading="lazy" />` : ''}
        </div>
      </div>
      <div class="memo-actions">
        <button class="btn-mini btn-edit" onclick="startEdit('${m.objectId}')">编辑</button>
        <button class="btn-mini btn-del" onclick="delMemo('${m.objectId}')">删除</button>
      </div>
    </div>
  `).join("");
}

/* -------------------------------------------------------
   3.10 操作函数
   ------------------------------------------------------- */

// 提交（新增或更新）—— 本地直接更新列表，不重新请求
async function submitMemo() {
  const title = $("titleInput").value.trim();
  const content = $("contentInput").value.trim();
  if (!title) {
    showToast("标题不能为空");
    cloudSay("写个标题嘛～");
    return;
  }

  showLoading(true);
  try {
    if (editingId) {
      // 编辑模式：更新本地列表
      const patch = { title, content };
      if (pendingImgUrl) patch.imgUrl = pendingImgUrl;
      await updateMemo(editingId, patch);
      // 直接更新本地对象，不重新请求
      const item = memoList.find(m => m.objectId === editingId);
      if (item) { item.title = title; item.content = content; if (pendingImgUrl) item.imgUrl = pendingImgUrl; }
      showToast("修改成功 ✿");
      exitEditMode();
      renderList();
    } else {
      // 新增模式：拿到返回的对象，直接插入本地列表
      const newMemo = await createMemo(title, content, pendingImgUrl);
      memoList.unshift(newMemo);
      renderList();
    }
    resetForm();
  } catch (e) {
    showToast("操作失败：" + e.message);
  } finally {
    showLoading(false);
  }
}

// 切换完成状态 —— 本地直接更新，不重新请求
async function toggleFinish(id, finish) {
  try {
    await updateMemo(id, { isFinish: finish });
    const item = memoList.find(m => m.objectId === id);
    if (item) item.isFinish = finish;
    renderList();
  } catch (e) {
    showToast("操作失败：" + e.message);
  }
}

// 进入编辑模式
function startEdit(id) {
  const m = memoList.find(x => x.objectId === id);
  if (!m) return;
  editingId = id;
  $("titleInput").value = m.title || "";
  $("contentInput").value = m.content || "";
  $("submitBtn").textContent = "💾 保存修改";
  $("editBar").classList.add("show");
  pendingImgUrl = m.imgUrl || null;
  if (m.imgUrl) {
    $("imgPreview").src = m.imgUrl;
    $("imgPreview").style.display = "block";
  }
  $("titleInput").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 退出编辑模式
function exitEditMode() {
  editingId = null;
  $("submitBtn").textContent = "＋ 添加备忘";
  $("editBar").classList.remove("show");
  resetForm();
}

// 重置表单
function resetForm() {
  $("titleInput").value = "";
  $("contentInput").value = "";
  $("aiInput").value = "";
  $("imgPreview").style.display = "none";
  $("imgPreview").src = "";
  $("fileInput").value = "";
  pendingImgUrl = null;
}

// 删除 —— 本地直接移除，不重新请求
async function delMemo(id) {
  if (!confirm("确定删除这条备忘吗？")) return;
  try {
    await deleteMemo(id);
    memoList = memoList.filter(m => m.objectId !== id);
    renderList();
    showToast("已删除");
    cloudSay("删掉了，轻松一点～");
  } catch (e) {
    showToast("删除失败：" + e.message);
  }
}

/* -------------------------------------------------------
   3.11 图片上传处理
   ------------------------------------------------------- */

$("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast("图片不能超过 5MB");
    return;
  }

  // 本地预览
  const reader = new FileReader();
  reader.onload = (ev) => {
    $("imgPreview").src = ev.target.result;
    $("imgPreview").style.display = "block";
  };
  reader.readAsDataURL(file);

  // 上传到 Bmob 文件存储
  showLoading(true);
  try {
    const url = await uploadImgToBmob(file);
    pendingImgUrl = url;
    showToast("图片上传成功 ✿");
  } catch (err) {
    showToast("图片上传失败：" + err.message);
    $("imgPreview").style.display = "none";
  } finally {
    showLoading(false);
  }
});

/* -------------------------------------------------------
   3.12 事件监听 & 键盘快捷键
   ------------------------------------------------------- */

$("titleInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("contentInput").focus(); }
});
$("contentInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); $("submitBtn").click();
  }
});
$("loginPass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("loginBtn").click(); }
});

/* -------------------------------------------------------
   3.13 页面初始化
   ------------------------------------------------------- */

(function init() {
  initTheme();           // 加载主题配色
  restoreSession();      // 恢复登录状态

  if (currentUser && sessionToken) {
    // 已登录
    $("userBar").style.display = "block";

    showLoading(true);
    fetchMemos()
      .catch(e => {

            </div>
          </div>`;
      })
      .finally(() => showLoading(false));
  } else {
    // 未登录

  }

  // 开场小云问候
  setTimeout(() => {
    cloudSay("嗨，我是小云，帮你记事的～");
  }, 1000);
})();

</script>
