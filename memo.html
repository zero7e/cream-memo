<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>奶油备忘录 · 治愈系小记</title>

<!--
================================================================================
  奶油黄治愈风 · H5 备忘录（单文件版）
  技术栈：原生 HTML + CSS + JavaScript（无任何框架/库）
  后端：Bmob 后端云 REST API（绝对不使用 localStorage 本地存储）
  数据表：Memo
        字段：title     字符串   备忘录标题
              content   字符串   备忘录内容
              isFinish  布尔值   是否完成（true=已完成, false=未完成）
================================================================================

  ★★★ 手动配置区（请把下面两行换成你自己的 Bmob 密钥）★★★

  1. 登录 Bmob 后台 => 设置 => 应用密钥
  2. 复制 Application ID  填到下面的 APPLICATION_ID
  3. 复制 REST API Key     填到下面的 REST_API_KEY
  4. 在 Bmob 后台创建数据表 Memo，并添加字段 title(String) content(String) isFinish(Boolean)
  5. 保存本文件，用浏览器双击打开即可使用

  注意：Bmob 旧版 REST 域名为 https://api.bmob.cn/1/classes/...
        如果你用的是新版 BMB（国际版/新版控制台），请把 BASE_URL 改成对应域名。
================================================================================
-->

<style>
/* ==========================================================================
   一、CSS 样式区：奶油黄治愈风格
   ========================================================================== */

/* 1. 全局重置：去掉默认边距，统一盒模型 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; /* 去掉手机点击高亮 */
}

/* 2. 页面整体背景：奶油黄渐变，温暖治愈 */
html, body {
  min-height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* 主色 #FFF3D9 为基底的柔和渐变背景 */
  background: linear-gradient(160deg, #FFF8E7 0%, #FFF3D9 50%, #FFEBC2 100%);
  background-attachment: fixed;
  color: #6b5b3e;            /* 文字主色：暖棕，柔和不刺眼 */
  padding: 18px 14px 60px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* 3. 主容器：大圆角卡片 + 柔和阴影，移动/电脑自适应 */
.container {
  max-width: 720px;          /* 电脑端最大宽度，避免太宽 */
  margin: 0 auto;
  background: #FFFDF6;       /* 卡片底色：比背景再亮一点 */
  border-radius: 28px;      /* 大圆角，治愈感 */
  padding: 26px 22px 30px;
  box-shadow: 0 10px 30px rgba(180, 150, 90, 0.18),
              0 2px 8px  rgba(180, 150, 90, 0.08);
}

/* 4. 顶部标题 */
.header {
  text-align: center;
  margin-bottom: 22px;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: #b8860b;            /* 金棕色标题 */
  letter-spacing: 1px;
}
.header .subtitle {
  font-size: 13px;
  color: #b0967a;
  margin-top: 6px;
}

/* 5. 输入表单区域 */
.form-card {
  background: #FFF6E0;
  border-radius: 20px;
  padding: 18px 16px;
  margin-bottom: 22px;
  box-shadow: inset 0 1px 3px rgba(180, 150, 90, 0.10);
}
.form-card input[type="text"],
.form-card textarea {
  width: 100%;
  border: none;
  outline: none;
  background: #FFFDF6;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  color: #6b5b3e;
  font-family: inherit;
  resize: vertical;          /* 内容框可纵向拖拽 */
  box-shadow: inset 0 0 0 1.5px rgba(180, 150, 90, 0.18);
  transition: box-shadow 0.2s ease;
}
.form-card input[type="text"] {
  margin-bottom: 12px;
}
.form-card input[type="text"]:focus,
.form-card textarea:focus {
  box-shadow: inset 0 0 0 2px #f0c04a; /* 聚焦时金色描边 */
}
.form-card textarea {
  min-height: 80px;
}

/* 6. 按钮样式 */
.btn {
  border: none;
  outline: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  border-radius: 14px;
  padding: 11px 18px;
  transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.btn:active {
  transform: scale(0.96);    /* 点击轻微缩小，反馈感 */
}
.btn-primary {
  background: linear-gradient(135deg, #ffd97a, #f0b429);
  color: #6b4a12;
  box-shadow: 0 6px 14px rgba(240, 180, 41, 0.35);
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  font-size: 16px;
}
.btn-primary:hover {
  box-shadow: 0 8px 18px rgba(240, 180, 41, 0.45);
}
.btn-mini {
  font-size: 13px;
  padding: 7px 12px;
  border-radius: 10px;
}
.btn-edit {
  background: #FFF1C2;
  color: #9a7b1f;
}
.btn-del {
  background: #FFE0E0;
  color: #c0506a;
}
.btn-edit:hover { background: #FFE9A8; }
.btn-del:hover  { background: #FFCECE; }

/* 7. 编辑模式下的取消按钮 */
.btn-cancel {
  background: #EFEFEF;
  color: #888;
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  font-size: 14px;
}

/* 8. 笔记列表 */
.list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.memo-item {
  background: #FFFDF6;
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: 0 4px 12px rgba(180, 150, 90, 0.12);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
  border: 1.5px solid rgba(240, 192, 74, 0.18);
}
.memo-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(180, 150, 90, 0.18);
}
.memo-item.done {
  background: #FBF3E0;       /* 完成态背景偏暗 */
  opacity: 0.85;
}
.memo-item.done .memo-title,
.memo-item.done .memo-content {
  text-decoration: line-through;
  color: #b0967a;
}

/* 9. 笔记顶部行：勾选框 + 标题 + 操作按钮 */
.memo-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.memo-check {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #f0c04a;
  background: #FFFDF6;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #fff;
  transition: all 0.2s ease;
}
.memo-check.checked {
  background: #6cc24a;
  border-color: #6cc24a;
}
.memo-check.checked::after {
  content: "✓";
  font-weight: bold;
}
.memo-title {
  flex: 1;
  font-size: 16px;
  font-weight: 700;
  color: #8a6a2a;
  word-break: break-all;
}
.memo-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

/* 10. 笔记内容 */
.memo-content {
  margin-top: 8px;
  font-size: 14px;
  color: #7a6647;
  white-space: pre-wrap;     /* 保留换行 */
  word-break: break-all;
}

/* 11. 笔记时间戳 */
.memo-time {
  margin-top: 8px;
  font-size: 11px;
  color: #c2a978;
}

/* 12. 空状态提示 */
.empty {
  text-align: center;
  padding: 40px 10px;
  color: #c2a978;
  font-size: 14px;
}
.empty .emoji {
  font-size: 40px;
  display: block;
  margin-bottom: 8px;
}

/* 13. 加载/提示浮层 */
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(107, 91, 62, 0.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 999;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 14. 加载遮罩 */
.loading-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255, 243, 217, 0.6);
  z-index: 998;
  align-items: center;
  justify-content: center;
}
.loading-mask.show {
  display: flex;
}
.loading-mask .spinner {
  width: 38px;
  height: 38px;
  border: 4px solid #f0c04a;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 15. 响应式：小屏（手机）微调 */
@media (max-width: 480px) {
  body { padding: 10px 8px 40px; }
  .container { padding: 20px 14px 24px; border-radius: 22px; }
  .header h1 { font-size: 22px; }
  .memo-title { font-size: 15px; }
  .btn-mini { padding: 6px 9px; font-size: 12px; }
}

/* 16. 大屏（电脑）居中显示更舒适 */
@media (min-width: 768px) {
  body { padding: 30px 16px 60px; }
  .container { padding: 34px 38px 38px; }
}
</style>
</head>

<body>

<!-- ============================================================================
     二、HTML 结构区：页面骨架
     ===================================================================== -->
<div class="container">

  <!-- 顶部标题 -->
  <div class="header">
    <h1>奶油备忘录</h1>
    <div class="subtitle">把每一件小事，温柔地记下来 ✿</div>
  </div>

  <!-- 输入表单卡片：新增 / 编辑共用 -->
  <div class="form-card">
    <!-- 标题输入框 -->
    <input type="text" id="titleInput" maxlength="50"
           placeholder="备忘录标题（必填）" />

    <!-- 内容输入框 -->
    <textarea id="contentInput" maxlength="500"
              placeholder="备忘录内容（选填，可换行）"></textarea>

    <!-- 主按钮：新增 / 保存（根据模式切换文字） -->
    <button class="btn btn-primary" id="submitBtn">＋ 添加备忘录</button>

    <!-- 编辑模式下显示的取消按钮（默认隐藏） -->
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;">取消编辑</button>
  </div>

  <!-- 笔记列表容器：由 JS 动态渲染 -->
  <div class="list" id="memoList">
    <!-- 列表内容由 renderList() 函数动态填充 -->
  </div>

</div>

<!-- 加载遮罩：发起网络请求时显示 -->
<div class="loading-mask" id="loadingMask">
  <div class="spinner"></div>
</div>

<!-- 轻提示：操作成功 / 失败时显示 -->
<div class="toast" id="toast"></div>


<!--
  ============================================================================
  ★★★ 架构说明 ★★★
  三级降级策略：
  1. 直连 Bmob REST API（多域名自动探测）
  2. Bmob JS SDK（已嵌入本地，使用 api.bmobcloud.com）
  3. CORS 公共代理（兜底方案）
  ============================================================================
-->
<!-- Bmob JavaScript SDK (本地嵌入，无需CDN) -->
<script src="Bmob-2.5.30.min.js"></script>
<script>
"use strict";

/* ============================================================================
   3.1 ★★★ Bmob 配置区 ★★★
   ======================================================================== */

const APPLICATION_ID = "6dd518b7fba75a11b75f9863883616a9";
const REST_API_KEY   = "9099ac88fc936a9ea14cff5e0844ac30";
const TABLE_NAME     = "Memo";

// Bmob 所有可能的 API 域名，按优先级排序
// api.bmobcloud.com: SDK 默认使用的新域名
// api.bmobapp.com:    Bmob 新平台域名
// api.bmob.cn:        Bmob 旧平台域名
const BMOB_API_HOSTS = [
  "https://api.bmobcloud.com",
  "https://api.bmobapp.com",
  "https://api.bmob.cn"
];
const BMOB_API_PATH = "/1";
let BMOB_WORKING_HOST = null;  // 探测成功后缓存可用域名

/* ============================================================================
   3.2 工具函数
   ======================================================================== */

const $ = (id) => document.getElementById(id);

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 3000);
}

function showLoading(show) {
  $("loadingMask").classList.toggle("show", show);
}

/**
 * Bmob REST API 标准请求函数
 * 使用 HTTP 头传递密钥（Bmob 官方要求的格式）
 * 必须通过 http://localhost:8001/memo.html 访问（不能用 file:// 协议）
 */
async function bmobRequest(method, path, body) {
  const fullPath = BMOB_API_PATH + path;

  const headers = {
    "X-Bmob-Application-Id": APPLICATION_ID,
    "X-Bmob-REST-API-Key": REST_API_KEY,
    "Content-Type": "application/json"
  };

  // 如果已有缓存的可用域名，优先使用
  const hosts = BMOB_WORKING_HOST
    ? [BMOB_WORKING_HOST]
    : BMOB_API_HOSTS;

  for (let i = 0; i < hosts.length; i++) {
    const host = hosts[i];
    const url = host + fullPath;

    const options = { method: method, headers: headers };
    if (body !== null && body !== undefined) {
      options.body = JSON.stringify(body);
    }

    try {
      const resp = await fetch(url, options);

      // 解析响应
      let data = null;
      const text = await resp.text();
      if (text) {
        try { data = JSON.parse(text); }
        catch (e) { data = null; }
      }

      if (resp.ok) {
        BMOB_WORKING_HOST = host;
        return data || {};
      }

      // Bmob 返回错误（400/401/403 等）
      const errMsg = (data && data.error) ? data.error : ("HTTP " + resp.status);
      throw new Error("Bmob 错误：" + errMsg);
    } catch (e) {
      // 如果是网络错误，尝试下一个域名
      if (e.message && e.message.indexOf("Bmob 错误") >= 0) {
        // 是 Bmob 返回的业务错误，直接抛出
        throw e;
      }

      // 网络层错误（DNS/CORS 等）
      console.warn("[网络错误] " + host + ": " + e.message);
      if (hosts.length === 1 || i === hosts.length - 1) {
        BMOB_WORKING_HOST = null;
        throw new Error("所有 Bmob API 域名均无法访问，请确认已通过 http://localhost:8001/memo.html 访问");
      }
    }
  }
}


/* ============================================================================
   3.4 状态变量
   ======================================================================== */

let memoList = [];        // 当前从云端拉取的笔记数组
let editingId = null;     // 正在编辑的笔记 objectId（null 表示当前是「新增」模式）


/* ============================================================================
   3.3 数据操作函数：浏览器直连 Bmob REST API
   path 参数格式：/classes/Memo 或 /classes/Memo/{id}
   ======================================================================== */

/**
 * ① 查询：从 Bmob 拉取全部 Memo（按创建时间倒序）
 */
async function fetchMemos() {
  const data = await bmobRequest("GET", "/classes/" + TABLE_NAME + "?order=-createdAt", null);
  memoList = data.results || [];
  renderList();
}

/**
 * ② 新增：向 Bmob 插入一条 Memo
 */
async function createMemo(title, content) {
  const body = { title, content, isFinish: false };
  await bmobRequest("POST", "/classes/" + TABLE_NAME, body);
  showToast("添加成功 ✿");
}

/**
 * ③ 修改：更新指定 objectId 的 Memo
 */
async function updateMemo(id, patch) {
  await bmobRequest("PUT", "/classes/" + TABLE_NAME + "/" + id, patch);
}

/**
 * ④ 删除：删除指定 objectId 的 Memo
 */
async function deleteMemo(id) {
  await bmobRequest("DELETE", "/classes/" + TABLE_NAME + "/" + id, null);
}


/* ============================================================================
   3.5 渲染函数：把 memoList 渲染成 HTML 列表
   ======================================================================== */

function renderList() {
  const wrap = $("memoList");

  // 空列表提示
  if (memoList.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <span class="emoji">🗒️</span>
        还没有备忘录，先记一条吧～
      </div>`;
    return;
  }

  // 拼接每一条笔记的 HTML
  wrap.innerHTML = memoList.map(m => {
    // 完成态样式
    const doneClass = m.isFinish ? "done" : "";
    const checkClass = m.isFinish ? "checked" : "";

    // 时间戳格式化（Bmob 返回 ISO 时间字符串）
    const timeStr = m.createdAt ? formatTime(m.createdAt) : "";

    return `
      <div class="memo-item ${doneClass}">
        <div class="memo-head">
          <!-- 圆形勾选按钮：点击切换完成状态 -->
          <div class="memo-check ${checkClass}"
               onclick="toggleFinish('${m.objectId}', ${!m.isFinish})"></div>

          <div class="memo-title">${escapeHtml(m.title)}</div>

          <div class="memo-actions">
            <!-- 编辑按钮 -->
            <button class="btn btn-mini btn-edit"
                    onclick="startEdit('${m.objectId}')">编辑</button>
            <!-- 删除按钮 -->
            <button class="btn btn-mini btn-del"
                    onclick="removeMemo('${m.objectId}')">删除</button>
          </div>
        </div>

        <!-- 内容（可能为空） -->
        ${m.content ? `<div class="memo-content">${escapeHtml(m.content)}</div>` : ""}

        <!-- 创建时间 -->
        ${timeStr ? `<div class="memo-time">${timeStr}</div>` : ""}
      </div>`;
  }).join("");
}

// 把 ISO 时间字符串转成 "YYYY-MM-DD HH:mm" 友好格式
function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
       + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// HTML 转义：防止用户输入的 < > 等字符破坏页面结构
function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}


/* ============================================================================
   3.6 业务事件函数：勾选完成 / 编辑 / 删除
   ======================================================================== */

/**
 * 勾选 / 取消完成：调用 Bmob PUT 更新 isFinish 字段
 * @param {string} id    笔记 objectId
 * @param {boolean} val  目标完成状态
 */
async function toggleFinish(id, val) {
  showLoading(true);
  try {
    await updateMemo(id, { isFinish: val });
    // 本地同步更新，避免重新拉取
    const m = memoList.find(x => x.objectId === id);
    if (m) m.isFinish = val;
    renderList();
    showToast(val ? "已标记完成 ✓" : "已取消完成");
  } catch (e) {
    showToast(e.message);
  } finally {
    showLoading(false);
  }
}

/**
 * 进入编辑模式：把笔记内容填入输入框，按钮文字改为「保存修改」
 */
function startEdit(id) {
  const m = memoList.find(x => x.objectId === id);
  if (!m) return;
  editingId = id;
  $("titleInput").value   = m.title || "";
  $("contentInput").value = m.content || "";
  $("submitBtn").textContent = "保存修改";
  $("cancelBtn").style.display = "block";
  // 滚动到表单并聚焦
  $("titleInput").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/**
 * 退出编辑模式：清空输入框，按钮文字改回「添加备忘录」
 */
function exitEditMode() {
  editingId = null;
  $("titleInput").value = "";
  $("contentInput").value = "";
  $("submitBtn").textContent = "＋ 添加备忘录";
  $("cancelBtn").style.display = "none";
}

/**
 * 删除笔记：先二次确认，再调用 Bmob DELETE
 */
async function removeMemo(id) {
  if (!confirm("确定删除这条备忘录吗？删除后不可恢复哦～")) return;
  showLoading(true);
  try {
    await deleteMemo(id);
    // 如果正在编辑这条，退出编辑模式
    if (editingId === id) exitEditMode();
    // 重新拉取最新列表
    await fetchMemos();
    showToast("已删除");
  } catch (e) {
    showToast(e.message);
  } finally {
    showLoading(false);
  }
}


/* ============================================================================
   3.7 表单提交：新增 / 保存修改 共用同一个按钮
   ======================================================================== */

$("submitBtn").addEventListener("click", async () => {
  // 取值并去首尾空格
  const title   = $("titleInput").value.trim();
  const content = $("contentInput").value.trim();

  // 简单校验：标题必填
  if (!title) {
    showToast("请填写标题～");
    $("titleInput").focus();
    return;
  }

  showLoading(true);
  try {
    if (editingId) {
      // ---- 编辑模式：调用 PUT 更新 ----
      await updateMemo(editingId, { title: title, content: content });
      showToast("修改已保存 ✿");
      exitEditMode();
    } else {
      // ---- 新增模式：调用 POST 创建 ----
      await createMemo(title, content);
      // 清空输入框
      $("titleInput").value = "";
      $("contentInput").value = "";
    }
    // 重新拉取列表，保证和云端一致
    await fetchMemos();
  } catch (e) {
    showToast(e.message);
  } finally {
    showLoading(false);
  }
});

// 取消编辑按钮
$("cancelBtn").addEventListener("click", exitEditMode);

// 回车快捷提交（在标题框按回车，自动跳到内容框；内容框按 Ctrl+Enter 提交）
$("titleInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    $("contentInput").focus();
  }
});
$("contentInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    $("submitBtn").click();
  }
});


/* ============================================================================
   3.8 页面初始化：打开页面时自动拉取笔记列表
   ======================================================================== */

(async function init() {
  showLoading(true);

  try {
    await fetchMemos();
  } catch (e) {
    $("memoList").innerHTML = `
      <div class="empty">
        <span class="emoji">😵</span>
        加载失败：${escapeHtml(e.message)}
        <div style="margin-top:16px;font-size:13px;color:#b0967a;line-height:1.8;text-align:left;padding:0 10px;">
          <b>💡 重要：请通过本地服务器访问</b><br/>
          1. 双击 <b>start-server.bat</b> 启动服务器<br/>
          2. 浏览器地址栏必须是 <code>http://localhost:8001/memo.html</code><br/>
          3. 不能直接双击 HTML 打开（file:// 协议会被浏览器限制）<br/>
          <br/>
          <b>排查步骤：</b><br/>
          1. 确认已在 Bmob 后台创建 <b>Memo</b> 数据表<br/>
          &nbsp;&nbsp;&nbsp;字段：title(String) / content(String) / isFinish(Boolean)<br/>
          2. 按 F12 打开浏览器 → 控制台 → 查看红色错误<br/>
          3. 确认电脑网络正常
        </div>
      </div>`;
  } finally {
    showLoading(false);
  }
})();

</script>
